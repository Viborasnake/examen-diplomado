"problem impact"><div class="impactCopy"><h1>Una deuda ya pagada<br><span>puede seguir frenando</span><br>un crédito hipotecario.</h1><p class="impactLead">El dato se corrige. <b>La operación no espera.</b></p></div><div><div class="problemFlow impactFlow"><article class="pbox blue"><small>01 · YA PAGADA</small><strong>Deuda regularizada</strong><p>La persona ya resolvió el problema.</p></article><div class="pa">→</div><article class="pbox bad"><small>02 · AÚN VISIBLE</small><strong>Sigue apareciendo</strong><p>El dato todavía bloquea la evaluación.</p></article><div class="pa">→</div><article class="pbox"><small>03 · CONSECUENCIA</small><strong>Crédito detenido</strong><p>La operación hipotecaria deja de avanzar.</p></article></div><div class="impactBreak"><b>Quiebre crítico:</b> corregir el origen no garantiza que la actualización llegue al banco a tiempo para retomar la evaluación.</div></div></div>`},{stage:0,time:'0:25–0:50',k:'RUTA SEGURA · PITCH v0.5',body:`<div class="hero"><div class="hero-copy"><h1>No partimos con Carolina.<br><span>La encontramos.</span></h1><p>Partimos investigando control de datos personales. Al buscar cuándo ese problema genera una consecuencia real, llegamos a un momento crítico: una evaluación hipotecaria bloqueada por información incorrecta, desactualizada o difícil de rastrear.</p></div><div><div class="logoCard"><div class="logoLock"><div class="logoIcon">♢</div><div class="logoWord">ruta<span>segura</span></div></div></div><div class="essence"><b>● NUESTRA ESENCIA</b>Simplificamos lo complejo. Acompañamos con claridad, transparencia y compromiso hasta resolver tu caso.</div></div></div>`},{stage:1,time:'0:50–1:30',k:'01 · DE LA HIPÓTESIS AL FOCO',title:'De una piscina amplia a un evento crítico',body:`<div class="focus"><div class="rings"><div class="ring r1"><div><small>Hipótesis inicial</small>Control sobre todos los datos</div></div><div class="ring r2"><div><small>Primer recorte</small>Banca</div></div><div class="ring r3"><div><small>Segmento final</small>Hipotecarios bloqueados<br>por una inconsistencia</div></div></div><div class="cards"><div class="card"><strong>¿Administrar datos siempre?</strong><p>La exploración tensionó esa idea.</p></div><div class="card"><strong>¿Confiar en un tercero?</strong><p>Supuesto crítico todavía abierto.</p></div><div class="card active"><strong>¿Cuándo duele de verdad?</strong><p>Cuando el dato cambia una decisión urgente y concreta.</p></div></div></div>`},{stage:1,time:'1:30–2:10',k:'02 · ALLÍ NACE CAROLINA',title:'La operación sigue corriendo mientras el dato se corrige',body:`<div class="story"><section class="storyPanel"><h2>Una vivienda viable.<br>Una deuda ya pagada.<br>Una evaluación detenida.</h2><p>Carolina consulta a la institución que informó la deuda, revisa el registro y vuelve al banco. Cada actor resuelve una parte, pero ella no encuentra un hilo que confirme que la corrección llegó al evaluador antes de que venza la operación.</p></section><aside class="casebox"><small>EL JOB REAL</small><strong>01</strong><p>operación que debe mantenerse viva mientras el dato se corrige entre distintos actores.</p><div class="goal">Carolina no quiere “corregir un dato”. Quiere ser evaluada con información correcta antes de que su operación pierda vigencia.</div></aside></div>`},{stage:3,time:'2:10–3:15',k:'03 · EVIDENCIA Y VACÍOS',title:'La evidencia sostiene la oportunidad, no el negocio',body:`<div class="evidence"><div class="column"><h2>Lo que sí sostiene</h2><div class="item"><strong>249k</strong><p>Reportes con saldos desactualizados y registros ambiguos.</p></div><div class="item"><strong>1.700</strong><p>Postulantes hipotecarios con diferencias entre registros para una misma persona.</p></div><div class="item"><strong>2026</strong><p>REDEC y Ley 21.719 cambian el contexto y vuelven oportuno investigar.</p></div></div><div class="column blue"><h2>Lo que debe probar el piloto</h2><div class="item"><strong>01</strong><p>Incidencia actual del problema en hipotecarios en Chile.</p></div><div class="item"><strong>02</strong><p>Dónde persiste el quiebre entre corrección y reingreso.</p></div><div class="item"><strong>03</strong><p>Aceptación, esfuerzo operativo, dueño interno y disposición a pagar.</p></div></div><div class="question"><b>Pregunta central:</b> ¿persiste una brecha relevante entre corregir el dato y lograr que el banco retome la evaluación?</div></div>`},{stage:4,time:'3:15–4:05',k:'04 · EL QUIEBRE',title:'Corregir el dato y retomar la evaluación siguen separados',body:`<div><div class="flow"><article class="node"><small>01 · ORIGEN</small><b>Entidad que reportó</b><p>Corrige el dato en la fuente.</p></article><article class="node"><small>02 · REGISTRO</small><b>Registro correspondiente</b><p>Refleja la actualización cuando aplica.</p></article><article class="node"><small>03 · EVALUACIÓN</small><b>Banco evaluador</b><p>Decide si retoma el análisis.</p></article><article class="node"><small>04 · RESULTADO</small><b>Reingreso</b><p>La operación vuelve al flujo si llega a tiempo.</p></article></div><div class="callout">Ruta Segura no crea otro registro. Conecta la corrección con la continuidad de la operación.</div></div>`},{stage:4,time:'4:05–4:40',k:'05 · COORDINAR SIN REEMPLAZAR',title:'La lógica de Uber: coordinar el sistema detrás de una sola experiencia',body:`<div class="analogy"><section class="panel"><h2>Uber Eats</h2><div class="lane"><b>Pedido</b><span>Persona</span><i></i><span>Restaurante</span></div><div class="lane"><b>Pago</b><span>Persona</span><i></i><span>Medio de pago</span></div><div class="lane"><b>Entrega</b><span>Restaurante</span><i></i><span>Repartidor</span></div></section><div class="equals">↔</div><section class="panel"><h2>Ruta Segura</h2><div class="lane"><b>Corrección</b><span>Carolina</span><i></i><span>Reportante</span></div><div class="lane"><b>Actualización</b><span>Reportante</span><i></i><span>Registro</span></div><div class="lane"><b>Reingreso</b><span>Evidencia</span><i></i><span>Banco</span></div><div class="micro"><div><small>01</small><b>Traduce y completa</b></div><div><small>02</small><b>Coordina y acompaña</b></div><div><small>03</small><b>Reúne evidencia</b></div></div></section></div>`},{stage:4,time:'4:40–5:30',k:'06 · PROTOTIPO',title:'Del relato al reingreso',body:`<div class="phones"><div class="phone"><span class="phoneCap">1 · RELATO Y ANTECEDENTES</span><div class="screen"><div class="notch"></div><div class="rs">▣ rutasegura</div><h3>Hablemos de lo que pasó.</h3><p>Con algunas preguntas simples prepararemos tu caso.</p><div class="bubble"><b>Cuéntame qué ocurrió con tu crédito.</b></div><div class="bubble me">Todavía aparece una deuda que pagué hace dos meses.</div><div class="bubble"><b>¿Qué institución informó la deuda?</b></div><div class="bubble me">Tarjeta Andes.</div><div class="btn">Continuar →</div></div></div><div class="phone"><span class="phoneCap">2 · SEGUIMIENTO</span><div class="screen"><div class="notch"></div><div class="rs">▣ rutasegura</div><h3>Tu caso está en investigación.</h3><p>Esperamos confirmación para verificar la corrección.</p><div class="event"><i class="dot">✓</i><div><b>Solicitud creada</b><span>Autorización registrada</span></div></div><div class="event"><i class="dot">✓</i><div><b>Antecedentes revisados</b><span>Comprobante correcto</span></div></div><div class="event"><i class="dot">✓</i><div><b>Recibida por la institución</b><span>Recepción confirmada</span></div></div><div class="event"><i class="dot wait">◷</i><div><b>En investigación</b><span>Validando actualización</span></div></div></div></div><div class="phone"><span class="phoneCap">3 · CIERRE VERIFICABLE</span><div class="screen"><div class="notch"></div><div class="rs">▣ rutasegura · banco</div><h3>Gestión de casos</h3><div class="case"><small>CASO RS–2026–0148</small><h4>Carolina</h4><p>Deuda pagada aún aparece en el informe.</p><div class="ok">✓ Resolución verificada<br><span style="font-weight:400">La persona ya fue informada.</span></div></div></div></div></div>`},{stage:4,time:'5:30–6:15',k:'07 · EXPERIENCIA',title:'Menos fricción, sin crear otro silo',body:`<div class="journeys"><div class="jrow"><div class="jlabel"><small>HOY</small><b>Sistema fragmentado</b></div><div class="phase"><b>Descubre el bloqueo</b><p>Pregunta la causa y revisa su informe.</p></div><div class="phase"><b>Busca el origen</b><p>Compara registros e identifica al reportante.</p></div><div class="phase"><b>Ingresa reclamo</b><p>Redacta otra vez y adjunta comprobantes.</p></div><div class="phase"><b>Espera y escala</b><p>Consulta, repite antecedentes y vuelve a esperar.</p></div><div class="phase"><b>Verifica y retoma</b><p>Comprueba por sí misma y pide reevaluación.</p></div></div><div class="jrow good"><div class="jlabel"><small>CON RUTA SEGURA</small><b>Una sola ruta</b></div><div class="phase"><b>Ingreso</b><p>Relata una vez y adjunta antecedentes.</p></div><div class="phase"><b>Orientación</b><p>Identifica responsable y faltantes.</p></div><div class="phase"><b>Coordinación</b><p>Expediente estructurado y trazable.</p></div><div class="phase"><b>Seguimiento</b><p>Estado, plazo y próxima acción visibles.</p></div><div class="phase"><b>Cierre</b><p>Evidencia vinculada al reingreso.</p></div></div><div class="delta"><article><small>INGRESO</small><b>Relatar una vez</b><p>Un caso y antecedentes reutilizables.</p></article><article><small>SEGUIMIENTO</small><b>Una ruta común</b><p>Responsable, estado, plazo y próxima acción.</p></article><article><small>CIERRE</small><b>Evidencia para reingresar</b><p>La corrección se conecta con la continuidad.</p></article></div></div>`},{stage:5,time:'6:15–7:05',k:'08 · QUIÉN USA Y QUIÉN PAGA',title:'La persona usa el servicio; el banco integra y paga',body:`<div class="roles"><article class="role"><small>BENEFICIARIA PRINCIPAL</small><strong>Carolina</strong><p>Claridad, menos esfuerzo y continuidad de su evaluación.</p><div class="tag">Uso gratuito para la persona</div></article><div class="arrow">→</div><article class="role route"><small>SERVICIO</small><strong>Ruta Segura</strong><p>Entrega un expediente estructurado, trazable y accionable al flujo que el banco ya utiliza.</p><ul><li>Autorización expresa</li><li>Mínimo de datos necesario</li><li>Sin decidir el crédito</li></ul></article><div class="arrow">→</div><article class="role"><small>COMPRADOR PROBABLE</small><strong>Crédito Hipotecario</strong><p>Menos reproceso y más operaciones viables.</p><ul><li>Operaciones y Servicio usan</li><li>Riesgo, Datos, Cumplimiento y Ciberseguridad habilitan</li><li>El piloto confirma el dueño interno</li></ul></article></div>`},{stage:5,time:'7:05–8:10',k:'09 · VALOR PARA EL BANCO',title:'Continuidad + eficiencia + trazabilidad',body:`<div class="value"><div><div class="valueCards"><article><small>MENOS TRABAJO EVITABLE</small><b>Menos contactos y reproceso</b><p>Clasificación, derivaciones y reconstrucción de antecedentes.</p></article><article><small>MÁS OPERACIONES VIABLES</small><b>Margen potencial preservado</b><p>Operaciones que no caen por una inconsistencia corregible.</p></article><article><small>MÁS TRAZABILIDAD</small><b>Evidencia de gestión</b><p>Apoyo al control y al nuevo contexto regulatorio.</p></article></div><div class="formula">Valor por comprobar = trabajo evitado + margen potencial preservado + trazabilidad − costo total</div></div><div class="sensitivity"><small>ESCENARIO EXPLORATORIO · NO AHORRO DEMOSTRADO</small><div class="money">$487 MM</div><div>interés bruto temporalmente expuesto</div><div class="barRange"><i></i></div><div class="ticks"><span>$117 MM</span><span>$1.462 MM</span></div></div></div>`},{stage:6,time:'8:10–9:20',k:'10 · PILOTO',title:'El siguiente paso es aprender con un piloto acotado',body:`<div class="pilot"><div class="pricing"><div class="price"><span>01</span><div><b>Implementación inicial</b><p>Configuración, seguridad y conexión.</p></div></div><div class="price"><span>02</span><div><b>Suscripción base</b><p>Plataforma, soporte y volumen incluido.</p></div></div><div class="price"><span>03</span><div><b>Volumen adicional</b><p>Cobro por caso gestionado sobre la base.</p></div></div></div><section class="pilotbox"><h2>Wizard of Oz pagado</h2><div class="scope"><b>1 banco</b><b>6–8 semanas</b><b>20–30 casos elegibles</b></div><p>Experiencia visible para Carolina y el banco; operación humana detrás, con apoyo acotado de IA. Antes de automatizar, medimos si el caso de negocio existe.</p><div class="measure"><article><strong>1</strong>Incidencia real</article><article><strong>2</strong>Aceptación del expediente</article><article><strong>3</strong>Tiempo y trabajo manual</article><article><strong>4</strong>Reingreso antes del vencimiento</article><article><strong>5</strong>Disposición a pagar</article></div></section></div>`},{stage:6,time:'9:20–10:00',k:'11 · CIERRE',title:'La continuidad conecta a Carolina con el caso de negocio',body:`<div class="close"><section class="metric"><small>MÉTRICA PRINCIPAL PROPUESTA</small><h2>¿La operación siguió viva?</h2><p><b>Tasa de continuidad hipotecaria:</b> % de postulantes afectados que reingresa con el dato correcto mientras su operación sigue vigente.</p></section><div><div class="ending">Seguimos la evidencia hasta encontrar el momento en que un dato pone en riesgo un proyecto de vida y una operación bancaria.<span>Allí encontramos a Carolina.</span></div><div class="note">La casa estaba lista. Ahora toca comprobar que el dato correcto también puede llegar a tiempo.</div></div></div>`}];let idx=0;const el=document.getElementById('slide'),bar=document.getElementById('bar'),count=document.getElementById('count');function stageHTML(active){return `<div class="stagebar">${stages.map((s,i)=>`<span class="stage ${i===active?'on':''}">${s}</span>`).join('')}</div>`}function render(){const s=slides[idx];el.innerHTML=`<header class="top"><div class="kicker">${s.k}</div>${stageHTML(s.stage)}<div class="time">${s.time}</div></header><section class="main">${s.title?`<div><h1 class="title">${s.title}</h1></div>`:''}${s.body}</section><footer class="footer"><span class="brand">RUTA SEGURA</span><span>${idx+1} / ${slides.length}</span></footer>`;bar.style.width=((idx+1)/slides.length*100)+'%';count.textContent=`${idx+1}/${slides.length}`;location.hash=`#${idx+1}`}function go(n){idx=Math.max(0,Math.min(slides.length-1,n));render()}document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key.toLowerCase()==='f')document.getElementById('full').click()});addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n>=1&&n<=slides.length&&n-1!==idx){idx=n-1;render()}});const n=parseInt(location.hash.slice(1));if(n>=1&&n<=slides.length)idx=n-1;render();const controlsAuto=document.querySelector('.controls');let controlsHideTimer;function wakeControls(){if(!controlsAuto)return;controlsAuto.classList.remove('auto-hide');clearTimeout(controlsHideTimer);controlsHideTimer=setTimeout(()=>controlsAuto.classList.add('auto-hide'),1000)}['keydown','mousemove','mousedown','touchstart'].forEach(evt=>window.addEventListener(evt,wakeControls,{passive:true}));wakeControls();const presentTimer=document.getElementById('presentTimer');let timerRemaining=600,timerRun=null;function drawPresentTimer(){const mm=String(Math.floor(timerRemaining/60)).padStart(2,'0'),ss=String(timerRemaining%60).padStart(2,'0');presentTimer.textContent=`${mm}:${ss}`;presentTimer.style.color=timerRemaining<=0?'#F87171':timerRemaining<=60?'#FBBF24':'#fff'}drawPresentTimer();setTimeout(()=>{timerRun=setInterval(()=>{if(timerRemaining>0)timerRemaining--;drawPresentTimer();if(timerRemaining<=0)clearInterval(timerRun)},1000)},5000);</script></body></html>
