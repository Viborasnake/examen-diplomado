const S=[
{stage:0,time:'0:00–0:30',k:'RUTA SEGURA · PITCH v0.5',dark:true,body:`<div><p class="bigquote">No partimos con Carolina.<br><em>La encontramos.</em></p><p class="sub" style="margin-top:24px">De un problema amplio a una oportunidad concreta.</p><div class="path"><b>Hipótesis</b><i></i><b>Evento crítico</b><i></i><b>Caso de negocio</b></div></div>`},
{stage:1,time:'0:30–1:15',k:'01 · DE LA HIPÓTESIS AL FOCO',title:'De una piscina amplia a un evento crítico',body:`<div class="funnel"><div class="rings"><div class="ring r1"><div><small>Hipótesis inicial</small>Control sobre<br>todos los datos</div></div><div class="ring r2"><div><small>Primer recorte</small>Banca</div></div><div class="ring r3"><div><small>Segmento final</small>Hipotecarios bloqueados<br>por una inconsistencia</div></div></div><aside><div class="decision"><b>¿Administrar datos siempre?</b><span>La evidencia exploratoria tensionó esa idea.</span></div><div class="decision"><b>¿Confiar en un tercero?</b><span>Supuesto crítico, todavía abierto.</span></div><div class="decision active"><b>¿Cuándo duele de verdad?</b><span>Cuando el dato cambia una decisión urgente.</span></div></aside></div>`},
{stage:1,time:'1:15–2:05',k:'02 · ALLÍ NACE CAROLINA',title:'La casa estaba lista. El dato no.',body:`<div class="carolina"><div class="storycard"><div class="hero">Una vivienda viable.<br>Una deuda ya pagada.<br>Una evaluación detenida.</div><p>Carolina corrige el origen, revisa el registro y vuelve al banco. Cada actor resuelve una parte, pero nadie le confirma que la corrección llegó al evaluador antes de que venza la operación.</p></div><div class="clock"><div class="num">01</div><div class="label">operación que sigue corriendo mientras el dato se corrige entre actores</div><div class="goal">Su trabajo no es “corregir un dato”. Es mantener viva la operación hasta ser evaluada con información correcta.</div></div></div>`},
{stage:3,time:'2:05–3:15',k:'03 · EVIDENCIA Y VACÍOS',title:'La evidencia sostiene la oportunidad, no el negocio',body:`<div class="evidence"><div class="evcol"><h2>Lo que sí sostiene</h2><div class="evitem"><strong>249k</strong><p>Reportes analizados con saldos desactualizados y registros ambiguos.</p></div><div class="evitem"><strong>1.700</strong><p>Postulantes hipotecarios con diferencias entre registros para una misma persona.</p></div><div class="evitem"><strong>2026</strong><p>REDEC y Ley 21.719 cambian el contexto y vuelven oportuno investigar.</p></div></div><div class="evcol prove"><h2>Lo que debe probar el piloto</h2><div class="evitem"><strong>01</strong><p>Incidencia actual en hipotecarios en Chile.</p></div><div class="evitem"><strong>02</strong><p>Dónde persiste el quiebre entre corrección y reingreso.</p></div><div class="evitem"><strong>03</strong><p>Aceptación, esfuerzo operativo, dueño interno y disposición a pagar.</p></div></div><div class="tagline"><b>Pregunta central:</b> aun con estos cambios, ¿persiste una brecha relevante entre corregir el dato y lograr que el banco retome la evaluación?</div></div>`},
{stage:4,time:'3:15–4:05',k:'04 · EL QUIEBRE',title:'Corregir el dato y retomar la evaluación siguen separados',body:`<div class="separated"><article class="node"><small>01 · Origen</small><b>Entidad que reportó</b><p>Corrige el dato en la fuente.</p></article><article class="node"><small>02 · Registro</small><b>Registro correspondiente</b><p>Refleja la actualización cuando aplica.</p></article><article class="node"><small>03 · Evaluación</small><b>Banco evaluador</b><p>Decide si retoma el análisis.</p></article><article class="node"><small>04 · Resultado</small><b>Reingreso</b><p>La operación vuelve al flujo si llega a tiempo.</p></article></div><div class="ribbon">Ruta Segura no crea otro registro. Conecta la corrección con la continuidad de la operación.</div>`},
{stage:4,time:'4:05–4:40',k:'05 · COORDINAR SIN REEMPLAZAR',title:'La lógica de Uber: coordinar el sistema detrás de una sola experiencia',body:`<div class="uber"><section class="ecosystem"><h2>Uber Eats</h2><div class="lanes"><div class="lane"><b>Pedido</b><div class="lineflow"><span>Persona</span><i></i><span>Restaurante</span></div></div><div class="lane"><b>Pago</b><div class="lineflow"><span>Persona</span><i></i><span>Medio de pago</span></div></div><div class="lane"><b>Entrega</b><div class="lineflow"><span>Restaurante</span><i></i><span>Repartidor</span></div></div></div></section><div class="equals">↔</div><section class="ecosystem"><h2>Ruta Segura</h2><div class="lanes"><div class="lane"><b>Corrección</b><div class="lineflow"><span>Carolina</span><i></i><span>Reportante</span></div></div><div class="lane"><b>Actualización</b><div class="lineflow"><span>Reportante</span><i></i><span>Registro</span></div></div><div class="lane"><b>Reingreso</b><div class="lineflow"><span>Evidencia</span><i></i><span>Banco</span></div></div></div><div class="three"><article><small>01</small><b>Traduce y completa</b></article><article><small>02</small><b>Coordina y acompaña</b></article><article><small>03</small><b>Reúne evidencia</b></article></div></section></div>`},
{stage:4,time:'4:40–5:30',k:'06 · PROTOTIPO',title:'Del relato al reingreso',clean:true,body:`<div class="phones"><div class="phone"><span class="phonecap">1 · RELATO Y ANTECEDENTES</span><div class="screen"><div class="notch"></div><div class="logo">▣ rutasegura</div><h3>Hablemos de lo que pasó.</h3><p>Con algunas preguntas simples prepararemos tu caso.</p><div class="chat"><div class="bubble"><b>Cuéntame con tus palabras qué ocurrió con tu crédito.</b></div><div class="bubble me">Me dijeron que todavía aparece una deuda de una tarjeta que pagué hace dos meses.</div><div class="bubble"><b>¿Qué institución informó la deuda?</b></div><div class="bubble me">Tarjeta Andes.</div></div><div class="btn">Continuar →</div></div></div><div class="phone"><span class="phonecap">2 · SEGUIMIENTO</span><div class="screen"><div class="notch"></div><div class="logo">▣ rutasegura</div><h3>Tu caso está en investigación.</h3><p>Esperamos confirmación para verificar la corrección.</p><div class="timeline"><div class="event"><i class="dot">✓</i><div><b>Solicitud creada</b><span>Autorización registrada</span></div></div><div class="event"><i class="dot">✓</i><div><b>Antecedentes revisados</b><span>Comprobante correcto</span></div></div><div class="event"><i class="dot">✓</i><div><b>Recibida por la institución</b><span>Recepción confirmada</span></div></div><div class="event"><i class="dot wait">◷</i><div><b>En investigación</b><span>Validando la actualización</span></div></div></div></div></div><div class="phone"><span class="phonecap">3 · CIERRE VERIFICABLE</span><div class="screen"><div class="notch"></div><div class="logo">▣ rutasegura · banco</div><h3>Gestión de casos</h3><p>Revisa antecedentes y verifica la resolución antes de cerrar.</p><div class="case"><small>CASO RS–2026–0148</small><h4>Carolina</h4><div class="alert">Deuda pagada aún aparece en el informe.<br><b>Tarjeta Andes · pago acreditado</b></div><div class="ok">✓ Resolución verificada<br><span style="font-weight:normal">La persona ya fue informada.</span></div></div></div></div></div><div class="proto-note">Prototipo exploratorio · las pantallas todavía no demuestran valor</div>`},
{stage:4,time:'5:30–6:15',k:'07 · EXPERIENCIA',title:'Menos fricción, sin crear otro silo',clean:true,body:`<div class="jmap"><div class="jrow"><div class="jlabel"><small>HOY</small><b>Sistema fragmentado</b></div><div class="phase"><b>Descubre el bloqueo</b><p>Pregunta la causa y revisa su informe.</p></div><div class="phase"><b>Busca el origen</b><p>Compara registros e identifica al reportante.</p></div><div class="phase"><b>Ingresa reclamo</b><p>Redacta otra vez y adjunta comprobantes.</p></div><div class="phase"><b>Espera y escala</b><p>Consulta, repite antecedentes y vuelve a esperar.</p></div><div class="phase"><b>Verifica y retoma</b><p>Comprueba por sí misma y pide reevaluación.</p></div></div><div class="jrow good"><div class="jlabel"><small>CON RUTA SEGURA</small><b>Una sola ruta</b></div><div class="phase"><b>Ingreso</b><p>Relata una vez y adjunta antecedentes.</p></div><div class="phase"><b>Orientación</b><p>Identifica responsable y faltantes.</p></div><div class="phase"><b>Coordinación</b><p>Expediente estructurado y trazable.</p></div><div class="phase"><b>Seguimiento</b><p>Estado, plazo y próxima acción visibles.</p></div><div class="phase"><b>Cierre</b><p>Evidencia vinculada al reingreso.</p></div></div><div class="jdelta"><article><small>INGRESO</small><b>Relatar una vez</b><p>Un caso y antecedentes reutilizables.</p></article><article><small>SEGUIMIENTO</small><b>Una ruta común</b><p>Responsable, estado, plazo y próxima acción.</p></article><article><small>CIERRE</small><b>Evidencia para reingresar</b><p>La corrección se conecta con la continuidad.</p></article></div></div>`},
{stage:5,time:'6:15–7:05',k:'08 · QUIÉN USA Y QUIÉN PAGA',title:'La persona usa el servicio; el banco integra y paga',body:`<div class="roles"><article class="role"><small>Beneficiaria principal</small><strong>Carolina</strong><p>Claridad, menos esfuerzo y continuidad de su evaluación.</p><div class="buyer">Uso gratuito para la persona</div></article><div class="arrow">→</div><article class="role route"><small>Servicio</small><strong>Ruta Segura</strong><p>Entrega un expediente estructurado, trazable y accionable al flujo que el banco ya utiliza.</p><ul><li>Autorización expresa</li><li>Mínimo de datos necesario</li><li>Sin decidir el crédito</li></ul></article><div class="arrow">→</div><article class="role"><small>Comprador probable</small><strong>Crédito Hipotecario</strong><p>Menos reproceso y más operaciones viables.</p><ul><li>Operaciones y Servicio usan</li><li>Riesgo, Datos, Cumplimiento y Ciberseguridad habilitan</li><li>El piloto confirma el dueño interno</li></ul></article></div>`},
{stage:5,time:'7:05–8:10',k:'09 · VALOR PARA EL BANCO',title:'Continuidad + eficiencia + trazabilidad',body:`<div class="valuegrid"><div><div class="valuecards"><article><small>Menos trabajo evitable</small><b>Menos contactos y reproceso</b><p>Clasificación, derivaciones y reconstrucción de antecedentes.</p></article><article><small>Más operaciones viables</small><b>Margen potencial preservado</b><p>Operaciones que no caen por una inconsistencia corregible.</p></article><article><small>Más trazabilidad</small><b>Evidencia de gestión</b><p>Apoyo al control y al nuevo contexto regulatorio.</p></article></div><div class="formula">Valor por comprobar = trabajo evitado + margen potencial preservado + trazabilidad − costo total</div></div><div class="sensitivity"><small>ESCENARIO EXPLORATORIO · NO AHORRO DEMOSTRADO</small><div class="money">$487 MM</div><div>interés bruto temporalmente expuesto</div><div class="range"><i></i><b></b></div><div class="ticks"><span>$117 MM</span><span>$1.462 MM</span></div><p style="font-size:12px;color:#b9c6c0;line-height:1.4;margin-top:24px">El piloto reemplazará supuestos por incidencia, tiempos, costos y continuidad observados dentro de un banco.</p></div></div>`},
{stage:6,time:'8:10–9:20',k:'10 · PILOTO',title:'El siguiente paso es aprender con un piloto acotado',body:`<div class="pilot"><div class="pricing"><div class="price"><span>01</span><div><b>Implementación inicial</b><p>Configuración, seguridad y conexión.</p></div></div><div class="price"><span>02</span><div><b>Suscripción base</b><p>Plataforma, soporte y volumen incluido.</p></div></div><div class="price"><span>03</span><div><b>Volumen adicional</b><p>Cobro por caso gestionado sobre la base.</p></div></div></div><section class="pilotbox"><h2>Wizard of Oz pagado</h2><div class="scope"><b>1 banco</b><b>6–8 semanas</b><b>20–30 casos elegibles</b></div><p style="max-width:650px;color:#c7d0cc;font-size:14px;line-height:1.4">Experiencia visible para Carolina y el banco; operación humana detrás, con apoyo acotado de IA. Antes de automatizar, medimos si el caso de negocio existe.</p><div class="measure"><article><strong>1</strong>Incidencia real</article><article><strong>2</strong>Aceptación del expediente</article><article><strong>3</strong>Tiempo y trabajo manual</article><article><strong>4</strong>Reingreso antes del vencimiento</article><article><strong>5</strong>Disposición a pagar</article></div></section></div>`},
{stage:6,time:'9:20–10:00',k:'11 · CIERRE',title:'La continuidad conecta a Carolina con el caso de negocio',dark:true,body:`<div class="close"><section class="metric"><small>MÉTRICA PRINCIPAL PROPUESTA</small><div class="q">¿La operación siguió viva?</div><p><b>Tasa de continuidad hipotecaria:</b> % de postulantes afectados que reingresa con el dato correcto mientras su operación sigue vigente.</p></section><div class="ending">Seguimos la evidencia hasta encontrar el momento en que un dato pone en riesgo un proyecto de vida y una operación bancaria.<span>Allí encontramos a Carolina.</span><div class="thanks">La casa estaba lista. Ahora toca comprobar que el dato correcto también puede llegar a tiempo.</div></div></div>`}
];
function stageHTML(active){return `<div class="stagebar">${STAGES.map((x,i)=>`<span class="stage ${i===active?'on':''}">${x}</span>`).join('')}</div>`}
let i=0; const el=document.getElementById('slide'), bar=document.getElementById('bar'), count=document.getElementById('count');
function render(){const s=S[i];el.className='slide'+(s.dark?' dark':'')+(s.clean?' clean':'');el.innerHTML=`<header class="top"><div class="kicker">${s.k}</div><div>${stageHTML(s.stage)}</div><div class="time">${s.time}</div></header><section class="main">${s.title?`<div><h1 class="h1">${s.title}</h1>${s.sub?`<p class="sub">${s.sub}</p>`:''}</div>`:''}${s.body}</section><footer class="footer"><span class="brand">Ruta Segura</span><span>${i+1} / ${S.length}</span></footer>`;bar.style.width=((i+1)/S.length*100)+'%';count.textContent=`${i+1}/${S.length}`;location.hash=`#${i+1}`;wireZoom()}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render()}
document.getElementById('prev').onclick=()=>go(i-1);document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)} if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)} if(e.key.toLowerCase()==='f')document.getElementById('full').click(); if(e.key==='Escape')document.getElementById('lightbox').classList.remove('open')});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n>=1&&n<=S.length&&n-1!==i){i=n-1;render()}});
const lb=document.getElementById('lightbox'), li=document.getElementById('lightimg');lb.onclick=()=>lb.classList.remove('open');
function wireZoom(){document.querySelectorAll('[data-zoom]').forEach(x=>x.onclick=()=>{li.src=x.dataset.zoom;lb.classList.add('open')})}
const first=parseInt(location.hash.slice(1)); if(first>=1&&first<=S.length)i=first-1; render();
</script>
</body></html>
