<script>const SLIDES=[{"k":"TALLER INTEGRADO · GRUPO 5","t":"La casa estaba lista. El dato no.","d":"Cuando una inconsistencia financiera tarda más en corregirse que una oportunidad hipotecaria en vencer.","p":"Tamara Valdivia","dark":true,"body":"\u003cdiv class=\"line\">\u003cb>Casa elegida\u003c/b>\u003ci>\u003c/i>\u003cb>Dato incorrecto\u003c/b>\u003ci>\u003c/i>\u003cb>Tiempo en contra\u003c/b>\u003c/div>\u003cp class=\"teamline\">Tamara Valdivia · Valeria Nieto · Erick Fuentealba · Cristian Pizarro\u003c/p>"},{"k":"01 · LA HISTORIA COMIENZA","t":"La vivienda no espera a que los sistemas se pongan de acuerdo.","d":"Carolina ya tiene una propiedad elegida y su evaluación está en curso. Entonces aparece una deuda pagada como vigente. La operación se detiene, pero la promesa y la oferta siguen corriendo.","p":"Tamara Valdivia","body":"\u003cdiv class=\"steps\">\u003carticle>\u003csmall>01\u003c/small>\u003cb>Encuentra\u003c/b>\u003cspan>La vivienda que puede financiar\u003c/span>\u003c/article>\u003carticle>\u003csmall>02\u003c/small>\u003cb>Postula\u003c/b>\u003cspan>Entrega antecedentes al banco\u003c/span>\u003c/article>\u003carticle class=\"hot\">\u003csmall>03\u003c/small>\u003cb>Se bloquea\u003c/b>\u003cspan>Aparece un dato incorrecto\u003c/span>\u003c/article>\u003carticle>\u003csmall>04\u003c/small>\u003cb>Pierde tiempo\u003c/b>\u003cspan>La operación sigue venciendo\u003c/span>\u003c/article>\u003c/div>"},{"k":"02 · NO ES UN CASO AISLADO","t":"Cuando el dato falla, la decisión también puede cambiar.","p":"Tamara Valdivia","src":"FTC · CFPB · Informe ARSOP","body":"\u003cdiv class=\"evidence\">\u003carticle>\u003cstrong>249.000\u003c/strong>\u003cb>reportes analizados\u003c/b>\u003cp>Saldos desactualizados, límites faltantes y registros ambiguos.\u003c/p>\u003c/article>\u003carticle>\u003cstrong>1.700\u003c/strong>\u003cb>postulantes hipotecarios\u003c/b>\u003cp>Una persona podía mostrar información distinta entre tres burós.\u003c/p>\u003c/article>\u003carticle class=\"acid\">\u003cstrong>3%\u003c/strong>\u003cb>obtuvo otra decisión\u003c/b>\u003cp>Entre quienes revisaron su reporte después de un rechazo.\u003c/p>\u003c/article>\u003caside>\u003cb>En Chile, el problema puede durar más que la oportunidad:\u003c/b> rezago histórico cercano a 45 días frente a 40 días entre colocaciones.\u003c/aside>\u003c/div>"},{"k":"03 · LO QUE REALMENTE ESTÁ EN JUEGO","t":"Carolina no quiere corregir un dato. Quiere llegar a la firma.","p":"Valeria Nieto","body":"\u003cdiv class=\"outcome\">\u003carticle class=\"acid outcome-main\">\u003cem>OUTCOME DEL CLIENTE\u003c/em>\u003cstrong>Mantener viva su operación hipotecaria hasta ser evaluada con el dato correcto.\u003c/strong>\u003c/article>\u003cdiv class=\"impact\">\u003carticle>\u003cem>FINANZAS\u003c/em>\u003cb>Dinero comprometido\u003c/b>\u003cp>Reserva, tasación, gastos previos y condiciones comerciales en riesgo.\u003c/p>\u003c/article>\u003carticle>\u003cem>PSICOLOGÍA\u003c/em>\u003cb>Pérdida de control\u003c/b>\u003cp>Miedo, frustración e incertidumbre ante una decisión difícil de explicar.\u003c/p>\u003c/article>\u003carticle>\u003cem>PROCESO\u003c/em>\u003cb>Tiempo que no vuelve\u003c/b>\u003cp>Repetir la historia, perseguir responsables y reconstruir evidencia.\u003c/p>\u003c/article>\u003c/div>\u003c/div>"},{"k":"04 · EL MISMO PROBLEMA, TRES RIESGOS","t":"Mientras la persona pierde tiempo, el banco expone valor.","p":"Valeria Nieto","src":"Banco Central de Chile · Ley 21.719 · SII","body":"\u003cdiv class=\"risk\">\u003carticle>\u003cem>COMERCIAL\u003c/em>\u003cstrong>$14.700 MM\u003c/strong>\u003cb>colocados por día\u003c/b>\u003cp>$5.363 mil millones en créditos de vivienda durante 2025.\u003c/p>\u003c/article>\u003carticle>\u003cem>OPERACIONAL\u003c/em>\u003cstrong>45 días\u003c/strong>\u003cb>de rezago histórico\u003c/b>\u003cp>Tiempo suficiente para deteriorar una oportunidad.\u003c/p>\u003c/article>\u003carticle class=\"acid\">\u003cem>REGULATORIO\u003c/em>\u003cstrong>$1.391 MM\u003c/strong>\u003cb>multa gravísima máxima\u003c/b>\u003cp>Hasta 20.000 UTM; reincidencia hasta $4.173 MM.\u003c/p>\u003c/article>\u003c/div>"},{"k":"05 · UN ESCENARIO PARA MEDIR","t":"Si solo el 1% del flujo se afecta, el problema ya importa.","p":"Valeria Nieto","src":"Modelo del equipo · sensibilidad, no pérdida observada","body":"\u003cdiv class=\"scenario\">\u003carticle class=\"ink\">\u003cem>ESCENARIO BASE · 12 MESES\u003c/em>\u003cstrong>$487 MM\u003c/strong>\u003cb>de interés bruto en riesgo\u003c/b>\u003cp>Sensibilidad para dimensionar el caso.\u003c/p>\u003c/article>\u003cdiv>\u003cp>\u003cb>1%\u003c/b> del flujo afectado\u003c/p>\u003cp>\u003cb>45 días\u003c/b> de demora\u003c/p>\u003cp>\u003cb>10%\u003c/b> de fuga supuesta\u003c/p>\u003caside>Rango: \u003cb>$117 MM–$1.462 MM\u003c/b>. El piloto debe reemplazar los supuestos.\u003c/aside>\u003c/div>\u003c/div>"},{"k":"06 · EL VACÍO ACTUAL","t":"Hoy cada actor resuelve una parte; nadie acompaña la operación completa.","p":"Erick Fuentealba","body":"\u003cdiv class=\"gap\">\u003carticle>\u003cem>RECORRIDO FRAGMENTADO\u003c/em>\u003ch2>Acreedor → buró → banco\u003c/h2>\u003cp>La persona repite su historia y recibe respuestas parciales.\u003c/p>\u003c/article>\u003cb>→\u003c/b>\u003carticle class=\"acid\">\u003cem>OPORTUNIDAD\u003c/em>\u003ch2>Un caso, un hilo conductor\u003c/h2>\u003cp>Entender, dirigir, seguir y verificar antes de que venza la operación.\u003c/p>\u003c/article>\u003c/div>"},{"k":"07 · LA RESPUESTA","t":"Convertimos un reclamo disperso en una resolución verificable.","p":"Erick Fuentealba","body":"\u003cdiv class=\"flow\">\u003carticle>\u003csmall>01\u003c/small>\u003cb>Entender\u003c/b>\u003cp>Traduce el relato y ordena la evidencia.\u003c/p>\u003c/article>\u003carticle>\u003csmall>02\u003c/small>\u003cb>Dirigir\u003c/b>\u003cp>Identifica responsable y derecho.\u003c/p>\u003c/article>\u003carticle>\u003csmall>03\u003c/small>\u003cb>Seguir\u003c/b>\u003cp>Registra hitos, plazos y derivaciones.\u003c/p>\u003c/article>\u003carticle>\u003csmall>04\u003c/small>\u003cb>Verificar\u003c/b>\u003cp>Confirma la corrección para reingresar.\u003c/p>\u003c/article>\u003c/div>"},{"k":"08 · DOS CAMINOS QUE VUELVEN A ABRIRSE","t":"Preservar la compra también preserva una operación para el banco.","p":"Erick Fuentealba","body":"\u003cdiv class=\"duo\">\u003carticle class=\"acid\">\u003cem>PERSONA\u003c/em>\u003ch2>Llegar a la firma\u003c/h2>\u003cul>\u003cli>Entender el bloqueo\u003c/li>\u003cli>Demostrar la corrección\u003c/li>\u003cli>Reingresar a tiempo\u003c/li>\u003cli>Conservar su compra\u003c/li>\u003c/ul>\u003c/article>\u003carticle class=\"ink\">\u003cem>BANCO · B2B2C\u003c/em>\u003ch2>Preservar la operación\u003c/h2>\u003cul>\u003cli>Menos triaje manual\u003c/li>\u003cli>Menos reproceso\u003c/li>\u003cli>Decisión respaldada\u003c/li>\u003cli>Menor demora y fuga\u003c/li>\u003c/ul>\u003c/article>\u003c/div>"},{"k":"09 · LA MÉTRICA QUE UNE LA HISTORIA","t":"¿La operación siguió viva después de corregir el dato?","p":"Cristian Pizarro","body":"\u003cdiv class=\"metrics\">\u003carticle class=\"ink\">\u003cem>NORTH STAR\u003c/em>\u003cstrong>Tasa de continuidad hipotecaria\u003c/strong>\u003cp>% de postulantes afectados que mantienen vigente su operación y reingresan tras una corrección verificada.\u003c/p>\u003c/article>\u003cdiv>\u003cp>\u003cb>KPI 1\u003c/b> Días de ventana preservados\u003c/p>\u003cp>\u003cb>KPI 2\u003c/b> Tiempo hasta corrección efectiva\u003c/p>\u003cp>\u003cb>KPI 3\u003c/b> Capital y margen preservados\u003c/p>\u003cp>\u003cb>KPI 4\u003c/b> Costo por caso resuelto\u003c/p>\u003c/div>\u003c/div>"},{"k":"10 · LA PRUEBA ANTES DEL PRODUCTO","t":"Primero demostraremos que la historia puede terminar distinto.","p":"Cristian Pizarro","body":"\u003cdiv class=\"pilot\">\u003carticle class=\"acid\">\u003cem>PILOTO 6–8 SEMANAS\u003c/em>\u003ch2>1 banco · 20–30 casos bloqueados\u003c/h2>\u003cp>Concierge operativo + traductor IA + trazabilidad manual controlada.\u003c/p>\u003c/article>\u003col>\u003cli>\u003cb>Incidencia\u003c/b> causas del bloqueo\u003c/li>\u003cli>\u003cb>Continuidad\u003c/b> operación preservada\u003c/li>\u003cli>\u003cb>Tiempo\u003c/b> días recuperados\u003c/li>\u003cli>\u003cb>Economics\u003c/b> margen y costo real\u003c/li>\u003c/ol>\u003c/div>"},{"k":"11 · EL FINAL QUE QUEREMOS PROBAR","t":"Corregir el dato antes de que se pierda la vivienda.","d":"Si la corrección llega a tiempo, Carolina recupera una evaluación justa y el banco conserva una operación que todavía puede cerrar.","p":"Cristian Pizarro","dark":true,"body":"\u003cdiv class=\"line\">\u003cb>Dato corregido\u003c/b>\u003ci>\u003c/i>\u003cb>Evaluación reabierta\u003c/b>\u003ci>\u003c/i>\u003cb>Oportunidad preservada\u003c/b>\u003c/div>"}];const SPEECHES=[{"p":"Tamara Valdivia","s":"01 · Portada","t":"La casa estaba lista. El dato no","x":"Carolina es un caso compuesto que reúne patrones observados en nuestra investigación. Encontró una vivienda que puede financiar y comenzó su evaluación hipotecaria. Pero mientras ella ve su próximo hogar, el sistema ve una deuda antigua que ya estaba pagada. Esa diferencia puede detener la operación antes de que alguien alcance a corregirla. Nuestra historia trata de ese momento: cuando un dato administrativo se interpone entre una persona, una decisión bancaria y una vivienda."},{"p":"Tamara Valdivia","s":"02 · La historia comienza","t":"La vivienda no espera","x":"Carolina ya eligió la propiedad, entregó antecedentes y tiene condiciones comerciales vigentes. Entonces aparece la inconsistencia. La evaluación se bloquea, pero la promesa, la reserva y la oferta siguen corriendo. Comienza a llamar al banco, al acreedor y al buró. Cada actor responde una parte, pero nadie puede decirle si la corrección llegará al evaluador antes de que venza la operación. El problema no es solo que el dato esté mal: es que el tiempo de corregir puede ser mayor que el tiempo disponible para comprar."},{"p":"Tamara Valdivia","s":"03 · Evidencia","t":"No es un caso aislado","x":"La evidencia confirma que el mecanismo existe. Un análisis de 249 mil reportes encontró saldos desactualizados, límites faltantes y registros ambiguos. Otro estudio con 1.700 postulantes hipotecarios mostró información distinta entre tres burós para una misma persona. Y un 3% de quienes revisaron su reporte después de un rechazo obtuvo una decisión diferente. En Chile se documentó un rezago histórico cercano a 45 días, frente a 40 días entre colocaciones sucesivas. Esto demuestra el descalce; el piloto deberá medir cuántos casos actuales afecta.","tr":"Valeria mostrará qué pierde la persona y qué expone el banco mientras el tiempo avanza."},{"p":"Valeria Nieto","s":"04 · Outcome del cliente","t":"Carolina quiere llegar a la firma","x":"El trabajo que Carolina intenta completar no es corregir un dato por sí mismo. Es mantener viva su operación hasta ser evaluada con información correcta. El bloqueo amenaza dinero ya comprometido, como reserva, tasación o gastos previos. También provoca miedo, frustración y pérdida de control. Y la obliga a repetir su historia, reconstruir evidencia y perseguir responsables. Por eso el outcome no es garantizar un crédito: es preservar una oportunidad de compra que todavía puede cerrar."},{"p":"Valeria Nieto","s":"05 · Tres riesgos para el banco","t":"El mismo problema expone valor","x":"Mientras Carolina pierde tiempo, el banco enfrenta tres riesgos. Primero, uno comercial: durante 2025 la banca colocó 5.363 mil millones de pesos en vivienda, casi 14.700 millones por día. Segundo, uno operacional: un rezago de 45 días puede deteriorar una oportunidad que estaba lista para avanzar. Tercero, uno regulatorio: la Ley 21.719 contempla hasta 20 mil UTM para una infracción gravísima, cerca de 1.391 millones de pesos, y hasta 4.173 millones en reincidencia. Son máximos legales, no multas automáticas, pero muestran que la calidad del dato ya tiene consecuencias concretas."},{"p":"Valeria Nieto","s":"06 · Escenario base","t":"Si solo el 1% se afecta, ya importa","x":"Para volver esta escala digerible construimos un escenario base, no una predicción. Si el 1% del flujo anual se ve afectado, la demora es de 45 días y asumimos una fuga del 10%, el interés bruto en riesgo durante doce meses llega a unos 487 millones de pesos. El rango de sensibilidad va desde 117 hasta 1.462 millones. La cifra importante no es creer que esa pérdida ya ocurrió; es entender que un porcentaje pequeño basta para justificar medir la incidencia real dentro del banco.","tr":"Erick mostrará el vacío actual y, recién después, la respuesta propuesta."},{"p":"Erick Fuentealba","s":"07 · El vacío actual","t":"Cada actor resuelve una parte","x":"Hoy la corrección recorre al menos tres mundos: el acreedor que originó el dato, el buró que lo distribuye y el banco que lo usa para evaluar. Carolina puede obtener una respuesta en cada lugar y aun así no saber si la corrección llegó al punto donde cambia la decisión. Ahí está la oportunidad: no abrir otro canal de reclamos, sino mantener un solo hilo conductor desde el problema inicial hasta la confirmación de que el evaluador recibió el dato correcto."},{"p":"Erick Fuentealba","s":"08 · La respuesta","t":"De reclamo disperso a resolución verificable","x":"Aquí revelamos la propuesta. Funciona en cuatro momentos: entiende el relato y ordena la evidencia; dirige la solicitud al responsable correcto; registra hitos, plazos y derivaciones; y confirma la corrección para respaldar el reingreso. La inteligencia artificial ayuda a estructurar y clasificar el caso; no decide si el crédito debe aprobarse. El valor central es la trazabilidad hasta la resolución verificable."},{"p":"Erick Fuentealba","s":"09 · Doble valor y modelo","t":"Dos caminos vuelven a abrirse","x":"Si la corrección llega a tiempo, Carolina puede continuar su compra y el banco puede preservar una operación que todavía tiene valor. Para la persona significa entender el bloqueo, demostrar la corrección y reingresar. Para el banco significa menos triaje manual, menos reproceso y una nueva evaluación respaldada. Proponemos un modelo B2B2C: la persona no paga por ejercer su derecho; la institución financia el servicio mediante licencia o volumen solo si demostramos operaciones preservadas y costos evitados.","tr":"Cristian explicará cómo sabremos si esta historia realmente termina distinto."},{"p":"Cristian Pizarro","s":"10 · North Star","t":"¿La operación siguió viva?","x":"La métrica principal es la tasa de continuidad hipotecaria: el porcentaje de postulantes afectados que mantienen vigente su operación y reingresan después de una corrección verificada. Esta métrica conecta el proyecto de vida de la persona con el valor económico del banco, sin prometer una aprobación. La acompañamos con días de ventana preservados, tiempo de corrección, capital y margen preservados, y costo por caso resuelto."},{"p":"Cristian Pizarro","s":"11 · Piloto","t":"Probar la historia antes de construir el producto","x":"Proponemos un piloto de seis a ocho semanas con un banco y entre veinte y treinta casos bloqueados. Operaremos con un servicio concierge, un traductor asistido por inteligencia artificial y trazabilidad manual controlada. Mediremos la causa del bloqueo, la incidencia, la tasa de continuidad, los días recuperados y la economía real por caso. Así reemplazaremos las sensibilidades internacionales por evidencia local del propio flujo bancario."},{"p":"Cristian Pizarro","s":"12 · Cierre","t":"El final que queremos probar","x":"La historia comenzó con una casa lista y un dato que no lo estaba. Queremos comprobar si puede terminar con el dato corregido, la evaluación reabierta y la oportunidad de compra todavía vigente. No pedimos construir una solución enterprise. Pedimos validar, con un banco y casos reales, si corregir a tiempo preserva el proyecto de vida de la persona y una operación valiosa para la institución."}];const QUESTIONS=[{"id":1,"group":"01 · Opportunity Brief","question":"Si saco la Ley 21.719, la IA y la “Resolución Verificada”, ¿cuál es exactamente el problema humano y de negocio que queda?","answer":"Una persona puede perder la posibilidad de financiar la vivienda que eligió porque un dato incorrecto no se corrige ni llega al punto de decisión antes de que venza su ventana comercial. El banco, a la vez, arriesga una colocación potencialmente viable y absorbe reproceso, contactos y demora.","state":"Evidencia"},{"id":2,"group":"01 · Opportunity Brief","question":"¿El segmento es “personas que piden hipotecarios” o específicamente personas cuya evaluación queda bloqueada por un dato incorrecto, desactualizado o no trazable?","answer":"El segmento priorizado es el segundo: postulantes con una compra en curso cuya evaluación queda bloqueada, distorsionada o sin trazabilidad suficiente por un dato incorrecto o desactualizado. No buscamos a todas las personas que solicitan un hipotecario.","state":"Evidencia"},{"id":3,"group":"01 · Opportunity Brief","question":"¿Qué cambió entre la hipótesis inicial amplia sobre control de datos y este nicho hipotecario? ¿Qué evidencia justificó ese foco?","answer":"El discovery debilitó la idea de monitoreo permanente: la necesidad aparece de forma reactiva cuando existe una consecuencia material. El hipotecario aporta un gatillante claro, una ventana que vence y un outcome medible. El foco se sostiene en desk research, entrevistas cualitativas y tensionamiento sintético; la incidencia local y la demanda B2B todavía deben validarse.","state":"Evidencia"},{"id":4,"group":"01 · Opportunity Brief","question":"¿Qué parte del Opportunity Brief está respaldada hoy y qué parte sigue siendo una promesa?","answer":"Respaldado: los errores existen, pueden afectar decisiones; los canales son fragmentados; la persona actúa ante una consecuencia; y corregir no equivale a comprobar el cierre. Promesa: incidencia hipotecaria chilena, aceptación bancaria, continuidad atribuible, disposición a pagar, ROI y escalabilidad.","state":"Evidencia"},{"id":5,"group":"02 · Assumption Map","question":"¿Cuál supuesto está simultáneamente arriba en importancia y abajo en evidencia?","answer":"Que el banco acepte un expediente de evidencia orquestado por un tercero y lo use para reingresar el caso antes del vencimiento. Sin esa conexión, puede existir una buena solicitud, pero no continuidad hipotecaria ni valor B2B demostrado.","state":"Por validar"},{"id":6,"group":"02 · Assumption Map","question":"Si los bancos no aceptan evidencia emitida por un tercero, ¿muere el negocio, cambia el producto o cambia el cliente?","answer":"Muere el modelo externo tal como está formulado, no el problema. El producto tendría que pivotear a un flujo interno del banco o limitarse a preparar y enrutar evidencia sin certificar el cierre. El comprador pasaría a ser una unidad interna, o la propuesta B2C quedaría con un valor más acotado.","state":"Por validar"},{"id":7,"group":"02 · Assumption Map","question":"¿Qué evidencia movería “disposición a pagar B2B” desde supuesto a conocimiento suficientemente confiable?","answer":"Un responsable con presupuesto debe comprometer un piloto pagado o una carta de intención con precio, alcance y condición de continuidad; luego renovar o ampliar al superar un umbral de ROI acordado. Las entrevistas de intención no bastan. El tablero propone buscar compromisos de tres bancos durante los primeros tres meses.","state":"Por validar"},{"id":8,"group":"02 · Assumption Map","question":"¿Hay frases del tablero que hoy suenan más demostradas de lo que la evidencia permite?","answer":"Sí: “destrabar evaluaciones”, “reducir créditos caídos”, “validez probatoria”, “Resolución Verificada” y metas como 60%, 50% o menos de 5% pueden sonar a resultado observado. Hoy son hipótesis, conceptos o criterios de éxito; deben presentarse con esa etiqueta.","state":"Evidencia"},{"id":9,"group":"03 · JTBD Canvas","question":"¿Cuál es el gatillante exacto: descubrir el error, recibir un rechazo, quedar detenido antes de escriturar o no poder demostrar la propagación de la corrección?","answer":"El gatillante operativo es quedar bloqueado, rechazado o en riesgo por un dato sospechoso durante una compra activa. Descubrir el error inicia la acción; no poder demostrar su propagación mantiene el problema abierto e impide recuperar certeza sobre la evaluación.","state":"Evidencia"},{"id":10,"group":"03 · JTBD Canvas","question":"¿El job es “corregir un dato” o “recuperar la posibilidad de continuar mi proceso hipotecario con certeza suficiente”?","answer":"Es recuperar la posibilidad de continuar el proceso hipotecario con certeza suficiente y con el dato correcto. La rectificación es un medio; el progreso buscado es preservar la opción de financiar la vivienda elegida.","state":"Evidencia"},{"id":11,"group":"03 · JTBD Canvas","question":"¿Qué hace hoy la persona para resolverlo y en qué punto concreto falla la alternativa actual?","answer":"Llama, va a sucursales, escribe correos, reclama al banco, acreedor o buró, repite su historia y reúne comprobantes. La alternativa falla al asignar responsable y, sobre todo, al demostrar que la corrección se propagó al sistema que evalúa el crédito.","state":"Evidencia"},{"id":12,"group":"03 · JTBD Canvas","question":"¿Qué pesa más: job funcional, personal o social?","answer":"Pesa más el job funcional: mantener viva la compra y volver a evaluación. El personal —miedo, pérdida de control e injusticia— amplifica la urgencia. El social, como reputación o sensación de estigma financiero, es relevante pero secundario.","state":"Evidencia"},{"id":13,"group":"04 · Matriz de oportunidad","question":"¿Por qué “comprobar que el dato fue corregido” debe ir antes que “seguir el estado” o “generar la solicitud”? ¿Qué evidencia sostiene el ranking?","answer":"Generar y seguir son pasos intermedios. Los hallazgos de v0.5 muestran que el caso solo termina cuando el antecedente deja de producir la consecuencia: “corregir” no equivale a “resolver”. La prioridad del cierre es evidencia cualitativa y sintética consistente, aunque debe confirmarse con casos reales.","state":"Evidencia"},{"id":14,"group":"04 · Matriz de oportunidad","question":"¿La demanda preliminar viene de personas reales, sintéticos, desk research o una combinación? ¿Con qué confianza?","answer":"Viene de una combinación. El mecanismo tiene respaldo relativamente alto en desk research; los patrones de conducta tienen confianza media por evidencia cualitativa limitada y sintéticos; la incidencia hipotecaria chilena y la demanda B2B tienen confianza baja. Los sintéticos tensionan hipótesis, no las validan.","state":"Evidencia"},{"id":15,"group":"04 · Matriz de oportunidad","question":"Cuando dicen que la oferta cubre poco la verificación del cierre, ¿qué mecanismo falta exactamente en las alternativas revisadas?","answer":"Falta una cadena entre actores: confirmación de corrección en la fuente, actualización del buró o receptor cuando corresponda, acuse del banco y reingreso del caso. Las alternativas revisadas resuelven solicitudes, consentimiento, eliminación o tracking dentro de un sistema, pero no el cierre donde ocurre la decisión.","state":"Evidencia"},{"id":16,"group":"04 · Matriz de oportunidad","question":"¿Estamos priorizando una necesidad porque es importante para el usuario o porque calza bien con nuestra solución?","answer":"Existe riesgo de sesgo de solución porque el lenguaje de “verificación” se fortaleció junto con el concepto. La necesidad sí precede a la solución: saber que la consecuencia terminó. La defensa es comparar el concepto con un concierge interno, un checklist y un proceso estandarizado más simples.","state":"Evidencia"},{"id":17,"group":"05 · Opportunity Solution Tree","question":"¿El outcome describe progreso del usuario o ya contiene una solución y una meta operacional?","answer":"El outcome actual mezcla los tres: progreso, el nombre “Resolución Verificada” y una meta de 60%. El outcome limpio es que la persona afectada preserve la posibilidad de ser evaluada con el dato correcto antes del vencimiento. El 60% debe quedar como hipótesis de éxito del piloto.","state":"Evidencia"},{"id":18,"group":"05 · Opportunity Solution Tree","question":"Si quitamos IA, dashboard y “Resolución Verificada”, ¿las oportunidades del OST siguen siendo válidas?","answer":"Sí. Siguen siendo válidas: entender qué ocurrió, identificar responsable y acción, evitar repetir la historia, saber qué evidencia falta, comprobar un cierre suficiente y preservar tiempo útil. Ninguna requiere por definición IA ni dashboard.","state":"Evidencia"},{"id":19,"group":"05 · Opportunity Solution Tree","question":"¿Qué oportunidad del árbol tiene más evidencia y cuál sigue casi enteramente apoyada en supuestos?","answer":"La más respaldada es reducir fragmentación y obtener certeza suficiente sobre responsable y cierre. La menos respaldada es que el banco pague y acepte evidencia de un tercero, y que esa aceptación recupere colocaciones con una incidencia económicamente relevante.","state":"Evidencia"},{"id":20,"group":"05 · Opportunity Solution Tree","question":"¿Cuál alternativa más simple podría producir el mismo outcome con menor integración y riesgo?","answer":"Un gestor interno de excepciones hipotecarias con intake estandarizado, checklist de evidencia, routing, SLA y confirmación manual de cierre usando canales existentes. Es la comparación obligatoria antes de justificar una plataforma externa.","state":"Escenario"},{"id":21,"group":"06 · Outcome / NSM / KPIs","question":"¿Por qué 60% de Resoluciones Verificadas es el outcome correcto? ¿Línea base, meta arbitraria o hipótesis?","answer":"No es todavía “el outcome correcto” ni una línea base observada. Es un umbral de aprendizaje propuesto en el Tablero Final. Debe presentarse como hipótesis y recalibrarse con el denominador y desempeño real del piloto.","state":"Evidencia"},{"id":22,"group":"06 · Outcome / NSM / KPIs","question":"¿La North Star mide progreso real del postulante o éxito del proceso interno?","answer":"Mide progreso real solo si exige continuidad o reingreso antes del vencimiento. Si se limita a contar “Resoluciones Verificadas”, puede celebrar un cierre documental sin efecto. La NSM recomendada es la tasa de postulantes afectados que reingresan con el dato correcto mientras la operación sigue vigente.","state":"Evidencia"},{"id":23,"group":"06 · Outcome / NSM / KPIs","question":"¿Qué KPI leading indicaría temprano que el sistema funciona antes del cierre completo?","answer":"El porcentaje de expedientes completos y correctamente enrutados al primer intento, complementado con la aceptación del paquete sin correcciones sustantivas. Predice velocidad y menor reproceso, pero no reemplaza la medición final de reingreso.","state":"Escenario"},{"id":24,"group":"06 · Outcome / NSM / KPIs","question":"¿Cómo evitar celebrar una solicitud bien estructurada si el dato nunca termina corrigiéndose donde afecta la decisión?","answer":"Con una definición de éxito por capas: la fuente confirma la corrección, el receptor confirma actualización, el banco reconoce recepción o uso y el caso reingresa antes de vencer. La calidad de la solicitud queda como KPI leading, nunca como outcome final.","state":"Evidencia"},{"id":25,"group":"07 · Propuesta de valor","question":"¿La promesa al usuario es “ejercer ARSOP” o “destrabar una incidencia sin entender el sistema legal y bancario”?","answer":"La promesa es destrabar una incidencia sin tener que entender el sistema legal y bancario, preservando la oportunidad hipotecaria. ARSOP habilita el mecanismo, pero no es el lenguaje de progreso que moviliza a la persona.","state":"Evidencia"},{"id":26,"group":"07 · Propuesta de valor","question":"¿Qué diferencia concreta existe frente a reclamar directamente al banco, acreedor o buró con una guía tradicional?","answer":"La diferencia propuesta es construir un expediente contextual, dirigirlo al actor correcto, sincronizar el seguimiento y reunir una cadena de cierre hasta el punto de decisión. Si no logra mayor aceptación o reingreso más rápido que una guía, la diferenciación no existe.","state":"Escenario"},{"id":27,"group":"07 · Propuesta de valor","question":"¿Por qué una persona confiaría datos financieros sensibles a otro actor justo cuando ya desconfía del ecosistema?","answer":"Solo con minimización de datos, propósito explícito, retención corta, cifrado, auditoría, revisión humana e identidad institucional clara. La confianza no está demostrada: el tablero la convierte en hipótesis y propone medir si al menos 30% entrega la evidencia mínima.","state":"Por validar"},{"id":28,"group":"07 · Propuesta de valor","question":"Para el banco, ¿la propuesta es cumplimiento, eficiencia, recuperación de colocaciones o una combinación? ¿Cuál domina?","answer":"Es una combinación, pero debe dominar la preservación de colocaciones viables y la eficiencia operacional. Cumplimiento crea urgencia y reduce exposición, pero una propuesta liderada solo por compliance se percibe como centro de costo.","state":"Escenario"},{"id":29,"group":"08 · Modelo como sistema","question":"¿El banco pagador tiene suficiente incentivo si el beneficiario inmediato es una persona que reclama por un dato usado por el propio ecosistema?","answer":"Sí, pero únicamente si el margen preservado, el menor reproceso y el riesgo evitado superan precio e integración, y si el efecto puede atribuirse. El banco también es beneficiario porque conserva una operación viable. Ese incentivo aún no está demostrado con datos reales.","state":"Por validar"},{"id":30,"group":"08 · Modelo como sistema","question":"¿Quién es el cliente real dentro del banco: hipotecario, operaciones, riesgo, CX, compliance, datos o tecnología?","answer":"El owner del outcome debe estar en Crédito Hipotecario/Riesgo; Operaciones es dueño del flujo. Gobierno de Datos, Privacidad/Compliance, CX y Tecnología integran el comité. El comprador económico probable es Hipotecario/Riesgo u Operaciones con sponsor de Compliance, y debe validarse.","state":"Escenario"},{"id":31,"group":"08 · Modelo como sistema","question":"¿Qué socios son imprescindibles y qué pasa si uno no coopera?","answer":"Son imprescindibles la fuente del dato, el buró cuando interviene y el banco evaluador. Si un actor no coopera, no puede declararse cierre completo: el caso debe mostrar evidencia parcial, escalarse o detenerse. El tercero no puede inventar la confirmación faltante.","state":"Escenario"},{"id":32,"group":"08 · Modelo como sistema","question":"¿Qué activo acumulable crea el uso: reglas, integraciones, benchmark, evidencia o todavía ninguno defendible?","answer":"Podrían acumularse una taxonomía de incidencias, reglas de routing y evidencia, benchmarks de respuesta, un grafo de resolución e integraciones. Hoy ninguno es defendible: todavía no existen volumen, exclusividad ni integración suficientes para constituir ventaja.","state":"Por validar"},{"id":33,"group":"09 · Monetización / Economics","question":"¿Qué unidad de cobro tiene más sentido: suscripción, caso resuelto, volumen, ahorro operacional o colocación recuperada?","answer":"Para aprender, un piloto de tarifa fija. A escala, una licencia más volumen de casos con SLA; cuando exista atribución confiable, un componente por caso resuelto puede alinear incentivos. Cobrar un porcentaje de la colocación recuperada es prematuro y complejo.","state":"Escenario"},{"id":34,"group":"09 · Monetización / Economics","question":"¿Cuál sería la ecuación de ROI que un banco aceptaría y qué variables hoy no pueden llenar con datos reales?","answer":"ROI = margen de colocaciones preservadas + costo operacional evitado + costo esperado de riesgo evitado − costo de licencia, integración y operación. Faltan incidencia local, fuga atribuible, margen por crédito, horas por caso, costo de integración, tasa de aceptación y continuidad causada por el mecanismo.","state":"Por validar"},{"id":35,"group":"09 · Monetización / Economics","question":"¿Cuánto valor genera reducir un día de demora versus rescatar una colocación que se habría caído?","answer":"Un día menos vale por menor costo operativo y menor probabilidad de vencimiento; una colocación rescatada vale por su contribución esperada de vida. Son magnitudes distintas y deben medirse por separado: velocidad es un leading indicator, recuperación es el resultado económico.","state":"Escenario"},{"id":36,"group":"09 · Monetización / Economics","question":"¿Qué pasa con el modelo si la incidencia real de errores de datos resulta mucho menor de lo esperado?","answer":"La economía puede dejar de sostener una plataforma transversal. Habría que concentrarse en excepciones de alto valor, vender capacidad interna de calidad/compliance, cobrar por caso o abandonar. El piloto debe permitir explícitamente esa decisión.","state":"Por validar"},{"id":37,"group":"10 · Factibilidad / Riesgo","question":"¿Quién tiene autoridad para decir que una “Resolución Verificada” está realmente verificada: fuente, banco, buró o tercero?","answer":"La fuente confirma la corrección; el buró confirma su actualización cuando corresponde; y el banco confirma recepción, uso o reingreso. El tercero solo orquesta y reúne la cadena. “Verificada” debe definirse como criterios compuestos de aceptación, no como autodeclaración.","state":"Evidencia"},{"id":38,"group":"10 · Factibilidad / Riesgo","question":"¿Qué parte de la trazabilidad pueden demostrar sin APIs ni acceso directo a sistemas fuente?","answer":"Se pueden demostrar envío, recepción, timestamps, respuesta de la fuente, certificados o documentos actualizados y acuse o reingreso del banco. No puede demostrarse la propagación de un campo interno ni su uso por el motor de decisión sin confirmación o integración bancaria.","state":"Evidencia"},{"id":39,"group":"10 · Factibilidad / Riesgo","question":"¿La IA debe decidir el derecho aplicable o asistir y explicar una recomendación con confianza y derivación humana?","answer":"Debe asistir: clasificar, explicar, proponer y mostrar nivel de confianza, con edición y derivación humana. No debe decidir autónomamente el derecho aplicable ni el resultado crediticio.","state":"Evidencia"},{"id":40,"group":"10 · Factibilidad / Riesgo","question":"¿Qué riesgo nuevo crean al concentrar documentos financieros e historial de incidencias en una plataforma externa?","answer":"Crean riesgo de filtración, uso secundario, sobre-retención, clasificación errónea, reidentificación, dependencia y responsabilidad difusa. La respuesta exige minimización, cifrado, segregación, retención corta, auditoría, gobernanza y revisión humana.","state":"Evidencia"},{"id":41,"group":"11 · Experimento / Evidencia","question":"Si solo pueden validar un supuesto esta semana, ¿cuál cambiaría más la decisión de seguir, pivotear o abandonar?","answer":"La aceptación B2B: si un analista recibe el expediente propuesto, ¿lo considera suficiente y lo usa para enrutar o reingresar el caso? Es el supuesto que conecta la acción del usuario con el outcome y el valor económico.","state":"Por validar"},{"id":42,"group":"11 · Experimento / Evidencia","question":"¿Cuál es el experimento más barato para saber si un analista bancario aceptaría una solicitud estructurada y cuál sería el criterio de éxito definido antes?","answer":"Un tabletop con 5–10 casos representativos, anonimizados o sintéticos, y analistas de hipotecario/riesgo que deban decidir aceptación y siguiente acción. Criterio propuesto: al menos dos instituciones aceptan el estándar y 70% de los casos no requiere corrección sustantiva, registrando toda condición o brecha.","state":"Por validar"},{"id":43,"group":"11 · Experimento / Evidencia","question":"¿Qué debería probar un prototipo mínimo: comprensión, clasificación, evidencia o aceptación B2B? ¿Intentar todo sería demasiado?","answer":"Debe probar primero aceptación B2B del paquete de evidencia, incorporando solo la comprensión y clasificación necesarias para producirlo. Intentar simultáneamente confianza, precisión IA, tracking, resolución y economía haría imposible saber qué supuesto falló.","state":"Por validar"},{"id":44,"group":"11 · Experimento / Evidencia","question":"¿Qué evidencia falsaría explícitamente la propuesta? Si nada puede hacerla caer, ¿la hipótesis está bien formulada?","answer":"La falsan: incidencia bajo el umbral económico; rechazo persistente del expediente aun con documentos requeridos; ausencia de mejora en tiempo o reingreso; usuarios que no entregan evidencia mínima; o costo de seguridad e integración superior al valor. Si nada de esto pudiera detenerla, la hipótesis no sería falsable.","state":"Por validar"},{"id":45,"group":"12 · Storyline / Pitch","question":"En una frase: ¿cuál es la situación, la complicación y la decisión que quieren que la audiencia tome?","answer":"Una compra viable está en curso; un dato erróneo puede sobrevivir más que la ventana de compra entre actores fragmentados; pedimos autorizar un piloto de 6–8 semanas para medir si un expediente coordinado preserva el reingreso y genera valor económico.","state":"Evidencia"},{"id":46,"group":"12 · Storyline / Pitch","question":"¿Por qué ahora? ¿La urgencia viene de la Ley, del costo de los errores, de la experiencia hipotecaria o de una combinación demostrable?","answer":"Viene de una combinación: la Ley 21.719 eleva exigencia y urgencia; la evidencia muestra el mecanismo y la fragmentación; y el flujo hipotecario vuelve material cada demora. Lo demostrado es la regulación y el mecanismo; la pérdida local atribuible sigue siendo un escenario a validar.","state":"Evidencia"},{"id":47,"group":"12 · Storyline / Pitch","question":"Si solo tienen seis láminas, ¿qué evidencia merece espacio y qué artefacto debería quedar fuera aunque haya costado mucho producirlo?","answer":"Seis láminas: protagonista y bloqueo; evidencia del mecanismo y límite local; outcome humano y bancario; sensibilidad económica/regulatoria; oportunidad, respuesta y NSM; piloto, criterios y decisión. Quedan en backup los canvases completos, benchmark detallado, transcripciones sintéticas y mapa íntegro de hipótesis.","state":"Evidencia"},{"id":48,"group":"12 · Storyline / Pitch","question":"¿Cuál es la objeción más peligrosa que queda abierta al terminar y cuál es el próximo experimento para resolverla?","answer":"La objeción es que todavía no sabemos si el banco aceptará evidencia externa ni si eso cambiará suficientes casos. El siguiente experimento es un concierge con 20–30 casos reales bloqueados, criterios de aceptación y reingreso acordados, midiendo incidencia, tiempo, continuidad, costo y causas de rechazo.","state":"Por validar"}];
let current=0,hideTimer;const $=s=>document.querySelector(s);function renderSlide(){const s=SLIDES[current],el=$("#slide");el.className="slide"+(s.dark?" dark":"");el.innerHTML="<header><b>"+s.k+"</b><span>"+String(current+1).padStart(2,"0")+" / "+SLIDES.length+"</span></header><div class='copy'><h1>"+s.t+"</h1>"+(s.d?"<p>"+s.d+"</p>":"")+"</div><div class='content'>"+s.body+"</div><footer><span>FEN UCHILE · DIPLOMADO EN ESTRATEGIA Y EXPERIENCIA DE PRODUCTOS EN LA ERA DE LA IA</span>"+(s.src?"<small>"+s.src+"</small>":"")+"<span>"+s.p+"</span></footer>";$("#bar").style.width=((current+1)/SLIDES.length*100)+"%";$("#prev").disabled=current===0;$("#next").disabled=current===SLIDES.length-1}function go(n){current=Math.max(0,Math.min(SLIDES.length-1,n));renderSlide()}function wake(){const c=$("#controls");c.classList.remove("hidden");clearTimeout(hideTimer);hideTimer=setTimeout(()=>c.classList.add("hidden"),2000)}function route(){const name=(location.hash.split("/")[1]||"presentacion");document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===name));$("#controls").style.display=name==="presentacion"?"flex":"none";document.documentElement.style.background=name==="presentacion"?"#09100d":"#f3f0e7";scrollTo(0,0)}
const byPerson=Object.groupBy?Object.groupBy(SPEECHES,s=>s.p):SPEECHES.reduce((a,s)=>((a[s.p]??=[]).push(s),a),{});$("#speeches").innerHTML=Object.entries(byPerson).map(([person,items])=>"<section class='person'><h2>"+person+"</h2><div class='speech-list'>"+items.map(s=>"<article class='speech'><small>"+s.s+"</small><h3>"+s.t+"</h3><p>"+s.x+"</p>"+(s.tr?"<blockquote><b>Transición:</b> "+s.tr+"</blockquote>":"")+"</article>").join("")+"</div></section>").join("");const KEY_IDS=[1,4,5,6,10,11,13,16,17,20,22,24,26,28,29,30,34,36,37,40,41,44,45,48];const KEY_QUESTIONS=QUESTIONS.filter(q=>KEY_IDS.includes(q.id));const grouped=KEY_QUESTIONS.reduce((a,q)=>((a[q.group]??=[]).push(q),a),{});$("#questions").innerHTML=Object.entries(grouped).map(([group,items])=>"<section id='g-"+items[0].id+"' class='defense-section'><h2>"+group+"</h2><div class='table-wrap'><table class='qa-table'><thead><tr><th>Pregunta</th><th>Respuesta</th></tr></thead><tbody>"+items.map(q=>"<tr><td>"+q.question+"</td><td>"+q.answer+"<br><span class='tag "+q.state.toLowerCase().replaceAll(" ","-")+"'>"+q.state+"</span></td></tr>").join("")+"</tbody></table></div></section>").join("");const groups=Object.entries(grouped);$("#sectionNav").innerHTML=groups.map(([group,items])=>"<button type='button' data-target='g-"+items[0].id+"'>"+group+"</button>").join("");document.querySelectorAll("#sectionNav button").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.target).scrollIntoView({behavior:"smooth",block:"start"}));
$("#prev").onclick=()=>go(current-1);$("#next").onclick=()=>go(current+1);$("#full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();$("#toTop").onclick=()=>scrollTo({top:0,behavior:"smooth"});addEventListener("hashchange",route);addEventListener("mousemove",wake);addEventListener("pointerdown",wake);addEventListener("keydown",e=>{wake();if(["ArrowRight","PageDown"," "].includes(e.key))go(current+1);if(["ArrowLeft","PageUp"].includes(e.key))go(current-1);if(e.key.toLowerCase()==="f")$("#full").click();if(e.key.toLowerCase()==="d")location.hash="#/defensa";if(e.key.toLowerCase()==="p")location.hash="#/parlamento"});renderSlide();route();wake();</script></body></html>
