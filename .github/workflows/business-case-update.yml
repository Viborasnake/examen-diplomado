name: Business case update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/business-case-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update presentation and speaker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"\{stage:5,time:'6:15–7:05',k:'08 · QUIÉN USA Y QUIÉN PAGA'.*?\}\];let idx=", re.S)
          tail = """{stage:5,time:'6:15–6:40',k:'08 · QUIÉN USA Y QUIÉN PAGA',title:'La persona usa el servicio; el banco integra y paga',body:`<div class=\"roles\"><article class=\"role\"><small>BENEFICIARIA PRINCIPAL</small><strong>Carolina</strong><p>Claridad, menos esfuerzo y continuidad de su evaluación.</p><div class=\"tag\">Uso gratuito para la persona</div></article><div class=\"arrow\">→</div><article class=\"role route\"><small>SERVICIO</small><strong>Ruta Segura</strong><p>Expediente estructurado, trazable y accionable.</p><ul><li>Autorización expresa</li><li>Mínimo de datos necesario</li><li>Sin decidir el crédito</li></ul></article><div class=\"arrow\">→</div><article class=\"role\"><small>COMPRADOR PROBABLE</small><strong>Crédito Hipotecario</strong><p>Menos reproceso y más operaciones viables.</p><ul><li>Operaciones y Servicio usan</li><li>Riesgo, Datos y Cumplimiento habilitan</li></ul></article></div>`},
          {stage:5,time:'6:40–7:05',k:'09 · POR QUÉ RUTA SEGURA',title:'¿Por qué este producto y no otro?',body:`<div><div class=\"valueCards\"><article><small>REGISTRO / REDEC</small><b>Corrige y consolida</b><p>Mejora la calidad del dato y habilita rectificación, pero no asegura por sí solo la continuidad de una operación hipotecaria.</p></article><article><small>MEJORA INTERNA</small><b>Reduce reproceso del banco</b><p>Una lista de control y confirmación manual puede mejorar el flujo interno; el piloto debe compararla contra Ruta Segura.</p></article><article style=\"background:#F1F8FF;border-color:#BFD9F3\"><small>RUTA SEGURA</small><b style=\"color:var(--blue)\">Coordina hasta el reingreso</b><p>Estructura, sigue responsables, conserva evidencia y conecta la corrección con la evaluación que sigue corriendo.</p></article></div><div class=\"formula\" style=\"margin-top:14px;text-align:center\"><b>El diferencial:</b> no generar más reclamos, sino comprobar que la corrección llegue a tiempo donde importa.</div></div>`},
          {stage:5,time:'7:05–7:30',k:'10 · MODELO DE MONETIZACIÓN',title:'B2B2C: Carolina usa; el banco paga',body:`<div class=\"pilot\"><section class=\"pilotbox\" style=\"background:var(--navy);color:#fff;border:0\"><small style=\"color:#B9DDF8;font-weight:900\">MODELO PROPUESTO</small><h2 style=\"font-size:58px;margin:18px 0\">B2B2C</h2><p style=\"color:#D5E0E7\">Para Carolina el servicio es gratuito. El banco paga solo si continuidad, eficiencia y trazabilidad superan el costo y la complejidad añadida.</p></section><div class=\"pricing\"><div class=\"price\"><span>01</span><div><b>Implementación inicial</b><p>Configuración, seguridad e integración.</p></div></div><div class=\"price\"><span>02</span><div><b>Suscripción base</b><p>Plataforma, soporte y volumen incluido.</p></div></div><div class=\"price\"><span>03</span><div><b>Volumen adicional</b><p>Cobro por caso gestionado, no corregido.</p></div></div></div></div>`},
          {stage:5,time:'7:30–8:10',k:'11 · CÓMO SABREMOS QUE FUNCIONA',title:'Outcome, North Star y KPIs concretos',body:`<div class=\"value\"><section class=\"sensitivity\"><small>OUTCOME DECLARADO</small><div class=\"money\">≥60%</div><div style=\"font-size:15px;line-height:1.45;color:#D5E0E7\">de solicitudes de rectificación para trámites hipotecarios alcanzan <b>Resolución Verificada y corrección efectiva</b> dentro de plazo.</div><div style=\"margin-top:24px;padding-top:16px;border-top:1px solid #44545F;font-size:12px;line-height:1.4\"><b style=\"color:#8CC4F5\">NORTH STAR:</b> % que obtiene Resolución Verificada antes de que caduque su evaluación crediticia.</div></section><div class=\"pricing\"><div class=\"price\"><span>+30%</span><div><b>KPI de comportamiento · hipótesis</b><p>Solicitudes completas y correctamente dirigidas al primer intento.</p></div></div><div class=\"price\"><span>+25%</span><div><b>KPI de negocio · hipótesis</b><p>Casos iniciados que alcanzan Resolución Verificada dentro del plazo.</p></div></div><div class=\"price\"><span>↓</span><div><b>KPI operativo</b><p>Días desde detección del error hasta actualización efectiva en el sistema evaluador.</p></div></div></div></div>`},
          {stage:5,time:'8:10–8:30',k:'12 · VALOR PARA EL BANCO',title:'Continuidad + eficiencia + trazabilidad',body:`<div class=\"value\"><div><div class=\"valueCards\"><article><small>MENOS TRABAJO EVITABLE</small><b>Menos contactos y reproceso</b><p>Clasificación, derivaciones y reconstrucción de antecedentes.</p></article><article><small>MÁS OPERACIONES VIABLES</small><b>Margen potencial preservado</b><p>Operaciones que no caen por una inconsistencia corregible.</p></article><article><small>MÁS TRAZABILIDAD</small><b>Evidencia de gestión</b><p>Apoyo al control y al nuevo contexto regulatorio.</p></article></div><div class=\"formula\">Valor por comprobar = trabajo evitado + margen potencial preservado + trazabilidad − costo total</div></div><div class=\"sensitivity\"><small>ESCENARIO EXPLORATORIO · NO AHORRO DEMOSTRADO</small><div class=\"money\">$487 MM</div><div>interés bruto temporalmente expuesto</div><div class=\"barRange\"><i></i></div><div class=\"ticks\"><span>$117 MM</span><span>$1.462 MM</span></div></div></div>`},
          {stage:6,time:'8:30–9:20',k:'13 · PILOTO Y ESCALA',title:'¿Cómo sabremos si el producto puede escalar?',body:`<div class=\"pilot\"><div class=\"pricing\"><div class=\"price\"><span>01</span><div><b>1 banco</b><p>Piloto Wizard of Oz pagado.</p></div></div><div class=\"price\"><span>02</span><div><b>6–8 semanas</b><p>Ventana para observar el flujo real.</p></div></div><div class=\"price\"><span>03</span><div><b>20–30 casos</b><p>Casos elegibles y autorizados.</p></div></div></div><section class=\"pilotbox\"><h2>Cuatro puertas de éxito</h2><div class=\"measure\" style=\"grid-template-columns:repeat(4,1fr)\"><article><strong>1</strong><b>Deseabilidad</b><br>Persona y banco usan el flujo.</article><article><strong>2</strong><b>Efectividad</b><br>Mejora primer intento y Resolución Verificada.</article><article><strong>3</strong><b>Negocio</b><br>Menos trabajo por caso + disposición a pagar.</article><article><strong>4</strong><b>Escala</b><br>Costo por caso baja al crecer el volumen.</article></div><div class=\"callout\" style=\"margin-top:14px\"><b>GO de escala:</b> continuidad ↑ + costo por caso ↓ + disposición a pagar confirmada. Los umbrales se acuerdan antes del piloto.</div></section></div>`},
          {stage:6,time:'9:20–9:28',k:'14 · CIERRE',body:`<div style=\"text-align:center\"><div style=\"font-size:84px;margin-bottom:20px\">⏸</div><h1 style=\"font-size:clamp(64px,8vw,120px);line-height:.9;margin:0;color:#C33C3C\">CRÉDITO PAUSADO</h1><p style=\"font-size:24px;color:var(--muted)\">Volvemos al punto donde quedó Carolina. La operación sigue viva, pero el tiempo corre.</p></div>`},
          {stage:6,time:'9:28–9:36',k:'15 · CIERRE',body:`<div style=\"text-align:center\"><div class=\"logoIcon\" style=\"margin:0 auto 24px\">✓</div><h1 style=\"font-size:clamp(56px,7vw,104px);line-height:.9;margin:0\">RUTA SEGURA<br><span style=\"color:var(--blue)\">INTERVIENE</span></h1><p style=\"font-size:22px;color:var(--muted)\">Ordena antecedentes · coordina responsables · reúne evidencia.</p></div>`},
          {stage:6,time:'9:36–9:44',k:'16 · CIERRE',body:`<div style=\"text-align:center\"><div style=\"font-size:80px;margin-bottom:18px\">🏦</div><h1 style=\"font-size:clamp(56px,7vw,104px);line-height:.9;margin:0\">EL BANCO<br><span style=\"color:var(--blue)\">REINCORPORA</span></h1><p style=\"font-size:22px;color:var(--muted)\">Recibe el expediente, valida la actualización y devuelve el caso al flujo.</p></div>`},
          {stage:6,time:'9:44–9:52',k:'17 · CIERRE',body:`<div style=\"text-align:center\"><div style=\"font-size:80px;margin-bottom:18px;color:var(--green)\">✓</div><h1 style=\"font-size:clamp(64px,8vw,120px);line-height:.9;margin:0;color:#1E9B43\">CRÉDITO VALIDADO</h1><p style=\"font-size:22px;color:var(--muted)\">La evaluación continúa con información correcta antes de perder vigencia.</p></div>`},
          {stage:6,time:'9:52–10:00',k:'18 · CIERRE',body:`<div><h1 style=\"text-align:center;font-size:52px;line-height:.95;margin:0 0 22px\">Cuando la operación sigue viva,<br><span style=\"color:var(--blue)\">ambos ganan.</span></h1><div class=\"story\"><section class=\"storyPanel\" style=\"text-align:center;background:#F1F8FF\"><div style=\"font-size:48px\">🏦</div><h2 style=\"font-size:36px;margin:14px 0\">Crédito colocado</h2><p>El banco conserva una operación viable y reduce reprocesos evitables.</p></section><aside class=\"casebox\" style=\"text-align:center;background:#F3FBF5;border-color:#CBECD4\"><div style=\"font-size:48px\">🏠</div><h2 style=\"font-size:36px;margin:14px 0\">Proyecto de vida en marcha</h2><p>Carolina obtiene el crédito y puede continuar con su casa propia.</p></aside></div><div class=\"callout\" style=\"margin-top:14px;text-align:center\"><b>Éxito =</b> mantener viva la operación + demostrar valor para el banco + reducir costo por caso al escalar.</div></div>`}];let idx="""
          s, n = pat.subn(tail, s, count=1)
          if n != 1:
              raise SystemExit(f'presentation tail replace failed: {n}')
          p.write_text(s, encoding='utf-8')

          sp = Path('speaker.html')
          if sp.exists():
              t = sp.read_text(encoding='utf-8')
              old = '<a href=\"#s0\">00</a><a href=\"#s1\">01</a><a href=\"#s2\">02</a><a href=\"#s3\">03</a><a href=\"#s4\">04</a><a href=\"#s5\">05</a><a href=\"#s6\">06</a><a href=\"#s7\">07</a><a href=\"#s8\">08</a><a href=\"#s9\">09</a><a href=\"#s10\">10</a><a href=\"#s11\">11</a><a href=\"#s12\">12</a>'
              t = t.replace(old, ''.join(f'<a href=\"#s{i}\">{i:02d}</a>' for i in range(19)))
              rp = re.compile(r'<article class=\"card\" id=\"s9\".*?</article>\s*</section>', re.S)
              cards = """<article class=\"card\" id=\"s9\"><aside class=\"side\"><div class=\"num\">09</div><div class=\"time\">6:15–6:40</div></aside><div><h2 class=\"title\">Quién usa y quién paga</h2><div class=\"script\"><p>Carolina usa el servicio sin pagar. Nuestra hipótesis de comprador es Crédito Hipotecario. Operaciones y Servicio usan el flujo; Riesgo, Datos y Cumplimiento habilitan sus controles.</p></div></div></article>
              <article class=\"card\" id=\"s10\"><aside class=\"side\"><div class=\"num\">10</div><div class=\"time\">6:40–7:05</div></aside><div><h2 class=\"title\">¿Por qué Ruta Segura?</h2><div class=\"script\"><p>REDEC mejora consolidación y rectificación. Una mejora interna puede reducir reproceso. Nuestra hipótesis diferencial es conectar actores externos y conservar evidencia hasta el reingreso. Un tercero solo se justifica si coordina mejor y a menor costo total.</p></div></div></article>
              <article class=\"card\" id=\"s11\"><aside class=\"side\"><div class=\"num\">11</div><div class=\"time\">7:05–7:30</div></aside><div><h2 class=\"title\">Modelo de monetización B2B2C</h2><div class=\"script\"><p>Implementación inicial + suscripción base + volumen adicional. Se cobra por caso gestionado, no corregido, porque el resultado depende de terceros.</p></div></div></article>
              <article class=\"card\" id=\"s12\"><aside class=\"side\"><div class=\"num\">12</div><div class=\"time\">7:30–8:10</div></aside><div><h2 class=\"title\">Outcome, North Star y KPIs</h2><div class=\"script\"><p><b>Outcome:</b> al menos 60% de solicitudes hipotecarias de rectificación alcanzan Resolución Verificada y corrección efectiva dentro de plazo.</p><p><b>North Star:</b> % de postulantes afectados que obtiene Resolución Verificada antes de que caduque su evaluación.</p><p><b>KPI comportamiento, hipótesis +30%:</b> solicitudes completas y bien dirigidas al primer intento.</p><p><b>KPI negocio, hipótesis +25%:</b> casos que alcanzan Resolución Verificada dentro del plazo.</p><p><b>KPI operativo:</b> días desde detección del error hasta actualización efectiva. Los +30% y +25% son hipótesis, no resultados.</p></div></div></article>
              <article class=\"card\" id=\"s13\"><aside class=\"side\"><div class=\"num\">13</div><div class=\"time\">8:10–8:30</div></aside><div><h2 class=\"title\">Valor para el banco</h2><div class=\"script\"><p>Menos trabajo evitable, más operaciones viables y más trazabilidad. La sensibilidad de 487 millones sigue siendo exploratoria y debe reemplazarse por evidencia observada.</p></div></div></article>
              <article class=\"card\" id=\"s14\"><aside class=\"side\"><div class=\"num\">14</div><div class=\"time\">8:30–9:20</div></aside><div><h2 class=\"title\">Piloto y condición de escala</h2><div class=\"script\"><p>1 banco, 6–8 semanas, 20–30 casos. Éxito exige cuatro puertas: deseabilidad, efectividad, negocio y escala.</p><p><b>Escala:</b> el costo operativo por caso debe bajar al aumentar el volumen, sin que las horas humanas crezcan en la misma proporción.</p><p><b>Go:</b> continuidad sube, costo por caso baja y disposición a pagar se confirma. Los umbrales se acuerdan antes del piloto.</p></div></div></article>
              <article class=\"card\" id=\"s15\"><aside class=\"side\"><div class=\"num\">15</div><div class=\"time\">9:20–9:28</div></aside><div><h2 class=\"title\">Crédito pausado</h2><div class=\"script\"><p>Volvemos al punto de la introducción: la operación sigue viva, pero el tiempo corre.</p></div></div></article>
              <article class=\"card\" id=\"s16\"><aside class=\"side\"><div class=\"num\">16</div><div class=\"time\">9:28–9:36</div></aside><div><h2 class=\"title\">Ruta Segura interviene</h2><div class=\"script\"><p>Ordena antecedentes, coordina responsables y reúne evidencia.</p></div></div></article>
              <article class=\"card\" id=\"s17\"><aside class=\"side\"><div class=\"num\">17</div><div class=\"time\">9:36–9:52</div></aside><div><h2 class=\"title\">El banco reincorpora y valida</h2><div class=\"script\"><p>El banco recibe el expediente, valida la actualización y devuelve el caso al flujo antes de perder vigencia.</p></div></div></article>
              <article class=\"card\" id=\"s18\"><aside class=\"side\"><div class=\"num\">18</div><div class=\"time\">9:52–10:00</div></aside><div><h2 class=\"title\">Cuando la operación sigue viva, ambos ganan</h2><div class=\"script\"><p>El banco conserva una colocación viable; Carolina obtiene el crédito para su proyecto de vida.</p><p><b>Éxito:</b> mantener viva la operación, demostrar valor para el banco y reducir costo por caso al escalar. Gracias.</p></div></div></article>
              </section>"""
              t, m = rp.subn(cards, t, count=1)
              if m != 1:
                  raise SystemExit(f'speaker replace failed: {m}')
              sp.write_text(t, encoding='utf-8')

          Path('.github/workflows/business-case-update.yml').unlink(missing_ok=True)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Explicita métricas, monetización y criterio de escala"
          git push
