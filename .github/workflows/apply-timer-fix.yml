name: Ajustar timer y controles

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar ajustes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Presentación: timer visible dentro del controlador, arranque a los 5 s,
          # controlador se oculta tras 1 s de inactividad.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'id="presentTimer"' not in s:
              s = s.replace(
                  '<span id="count" class="count"></span>',
                  '<span id="presentTimer" class="count" style="min-width:54px">10:00</span><span id="count" class="count"></span>'
              )

          s = s.replace(
              "controlsHideTimer=setTimeout(()=>controlsAuto.classList.add('auto-hide'),2000)",
              "controlsHideTimer=setTimeout(()=>controlsAuto.classList.add('auto-hide'),1000)"
          )

          timer_js = """const presentTimer=document.getElementById('presentTimer');let timerRemaining=600,timerRun=null;function drawPresentTimer(){const mm=String(Math.floor(timerRemaining/60)).padStart(2,'0'),ss=String(timerRemaining%60).padStart(2,'0');presentTimer.textContent=`${mm}:${ss}`;presentTimer.style.color=timerRemaining<=0?'#F87171':timerRemaining<=60?'#FBBF24':'#fff'}drawPresentTimer();setTimeout(()=>{timerRun=setInterval(()=>{if(timerRemaining>0)timerRemaining--;drawPresentTimer();if(timerRemaining<=0)clearInterval(timerRun)},1000)},5000);"""
          if 'let timerRemaining=600' not in s:
              s = s.replace('wakeControls();</script>', 'wakeControls();' + timer_js + '</script>')

          p.write_text(s, encoding='utf-8')

          # Notas: quitar timer/controlador completo. Mantener Slide 0 + guion MD.
          p = Path('speaker.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('padding-bottom:96px', 'padding-bottom:0')
          s = re.sub(r'\n<nav class="controller"[\s\S]*?</script>\s*', '\n', s, count=1)
          p.write_text(s, encoding='utf-8')

          # El workflow es temporal: se elimina a sí mismo después de aplicar el cambio.
          Path('.github/workflows/apply-timer-fix.yml').unlink(missing_ok=True)
          PY

      - name: Commit de los ajustes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Mueve timer a presentación y limpia notas"
          git push
