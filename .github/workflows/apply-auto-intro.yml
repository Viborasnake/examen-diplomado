name: Apply automatic impact intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auto-intro.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply automatic intro sequence
        shell: bash
        run: |
          cat > /tmp/patch_intro.py <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          .intro-sequence{position:fixed;inset:0;z-index:200;background:#fff;opacity:0;pointer-events:none;transition:opacity .32s ease;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.intro-sequence.show{opacity:1;pointer-events:auto}.intro-sequence.exit{opacity:0}.intro-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8vw;opacity:0;transform:scale(.985);transition:opacity .32s ease,transform .42s ease,background-color .35s ease}.intro-state.active{opacity:1;transform:scale(1)}.intro-inner{width:min(1080px,92vw);margin:auto}.intro-kicker{font-size:clamp(13px,1vw,17px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:26px;opacity:.72}.intro-title{font-size:clamp(58px,8vw,132px);line-height:.9;letter-spacing:-.065em;font-weight:900;margin:0}.intro-sub{font-size:clamp(18px,1.9vw,31px);line-height:1.35;margin:30px auto 0;max-width:820px;font-weight:500}.intro-dream{background:#fff;color:var(--navy)}.intro-dream .intro-title span{color:var(--blue)}.intro-dream .intro-kicker{color:#607A8B}.intro-processing{background:#F3FBF5;color:#167C38}.intro-processing .intro-kicker{color:#368553}.intro-processing .intro-sub{color:#4F7560}.intro-loader{width:min(520px,66vw);height:7px;border-radius:999px;background:#DCEDE1;margin:44px auto 0;overflow:hidden;position:relative}.intro-loader:after{content:"";position:absolute;inset:0 auto 0 0;width:42%;border-radius:inherit;background:var(--green);animation:introProgress 1.8s cubic-bezier(.2,.7,.25,1) forwards}@keyframes introProgress{from{width:8%}to{width:92%}}.intro-rejected{background:#C62828;color:#fff}.intro-rejected .intro-kicker{color:#FFD9D9}.intro-rejected .intro-title{font-size:clamp(74px,10.5vw,172px);letter-spacing:-.055em}.intro-rejected .intro-sub{color:#fff;opacity:.92}.controls.intro-hidden{opacity:0!important;pointer-events:none!important}.intro-pulse{width:16px;height:16px;border-radius:50%;background:currentColor;margin:30px auto 0;animation:introPulse 1.05s ease-in-out infinite}@keyframes introPulse{50%{transform:scale(.55);opacity:.35}}
          '''

          if '.intro-sequence{' not in s:
              s = s.replace('</style>', css + '</style>')

          html = r'''<div id="introSequence" class="intro-sequence" aria-hidden="true">
            <section class="intro-state intro-dream active" data-intro="dream">
              <div class="intro-inner">
                <div class="intro-kicker">Ruta Segura</div>
                <h1 class="intro-title">Tu sueño de la<br><span>casa propia.</span></h1>
              </div>
            </section>
            <section class="intro-state intro-processing" data-intro="processing">
              <div class="intro-inner">
                <div class="intro-kicker">Evaluación hipotecaria</div>
                <h1 class="intro-title">Procesando...</h1>
                <p class="intro-sub">Tu crédito hipotecario está siendo evaluado.</p>
                <div class="intro-loader" aria-hidden="true"></div>
              </div>
            </section>
            <section class="intro-state intro-rejected" data-intro="rejected">
              <div class="intro-inner">
                <div class="intro-kicker">Evaluación hipotecaria</div>
                <h1 class="intro-title">RECHAZADO</h1>
                <p class="intro-sub">Tu solicitud no pudo continuar.</p>
                <div class="intro-pulse" aria-hidden="true"></div>
              </div>
            </section>
          </div>'''

          if 'id="introSequence"' not in s:
              s = s.replace('<body>', '<body>' + html)

          old = "const n=parseInt(location.hash.slice(1));if(n>=1&&n<=slides.length)idx=n-1;render();const controlsAuto=document.querySelector('.controls');"
          new = "const initialHash=location.hash;const n=parseInt(location.hash.slice(1));if(n>=1&&n<=slides.length)idx=n-1;render();const introSequence=document.getElementById('introSequence');const introStates=[...document.querySelectorAll('[data-intro]')];function introState(name){introStates.forEach(x=>x.classList.toggle('active',x.dataset.intro===name))}function runAutomaticIntro(){if(!introSequence)return;const introControls=document.querySelector('.controls');introControls?.classList.add('intro-hidden');introSequence.classList.add('show');introState('dream');setTimeout(()=>introState('processing'),1550);setTimeout(()=>introState('rejected'),3350);setTimeout(()=>introSequence.classList.add('exit'),4550);setTimeout(()=>{introSequence.remove();introControls?.classList.remove('intro-hidden')},4900)}if((!initialHash||initialHash==='#1')&&idx===0)runAutomaticIntro();else introSequence?.remove();const controlsAuto=document.querySelector('.controls');"

          if 'function runAutomaticIntro()' not in s:
              if old not in s:
                  raise SystemExit('Expected JS marker not found')
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/apply-auto-intro.yml').unlink(missing_ok=True)
          PY
          python3 /tmp/patch_intro.py

      - name: Commit automatic intro
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Agrega intro automática de impacto"
          git push
