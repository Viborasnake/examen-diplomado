name: Expand speaker intro

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expand-speaker-intro.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch intro
        run: python3 .github/patch_expand_intro.py
      - name: Commit changes
        run: |
          rm -f .github/patch_expand_intro.py .github/workflows/expand-speaker-intro.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Desglosa la intro del proceso hipotecario"
          git push
