name: Fix KPI layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-kpi-layout.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Elimina el segundo controlador superpuesto que duplicaba eventos de click.
          s=re.sub(r'// Intro controller bridge: keep controls visible and clickable during slide 0\.\n\(function\(\)\{.*?\}\)\(\);\n?', '', s, flags=re.S)

          # La intro es la slide lógica 0: muestra microprogreso sin perder esa numeración.
          s=s.replace("count.textContent=(introStep+1)+'/7'", "count.textContent='0 · '+(introStep+1)+'/7'")

          # Durante la slide 0 el controlador debe permanecer visible; después vuelve al auto-hide normal.
          old="function wakeControls(){if(!controlsAuto)return;controlsAuto.classList.remove('auto-hide');clearTimeout(controlsHideTimer);controlsHideTimer=setTimeout(()=>controlsAuto.classList.add('auto-hide'),1000)}"
          new="function wakeControls(){if(!controlsAuto)return;controlsAuto.classList.remove('auto-hide');clearTimeout(controlsHideTimer);if(introSequence&&document.body.contains(introSequence)){return}controlsHideTimer=setTimeout(()=>controlsAuto.classList.add('auto-hide'),1000)}"
          if old in s:
              s=s.replace(old,new,1)

          css='.controls.intro-hidden.auto-hide{opacity:1!important;pointer-events:auto!important;transform:translateX(-50%)!important}'
          if css not in s:
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Corrige controlador sin eventos duplicados' || exit 0
          git push
