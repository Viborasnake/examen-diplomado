name: Hide speaker times

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hide-speaker-times.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide time labels in speaker guide
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('speaker.html')
          s = p.read_text(encoding='utf-8')
          old = '.time{font-size:12px;font-weight:800;color:#6f8797;margin-top:8px}'
          new = '.time{display:none}'
          if old not in s:
              raise SystemExit('time style not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          Path('.github/workflows/hide-speaker-times.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Quita tiempos del guion de speaker"
          git push
