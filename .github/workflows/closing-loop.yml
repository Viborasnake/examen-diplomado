name: Closing loop sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/closing-loop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace closing slide with narrative sequence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
.closeBeat{width:min(1120px,92vw);margin:auto;text-align:center;display:grid;justify-items:center;gap:22px}
.closeBeatIcon{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;background:var(--light);color:var(--blue);border:1px solid #CFE2F6;box-shadow:0 14px 34px rgba(31,41,51,.08)}
.closeBeatIcon svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.closeBeat h2{font-size:clamp(62px,7vw,118px);line-height:.9;letter-spacing:-.065em;margin:0}
.closeBeat p{font-size:clamp(20px,1.8vw,30px);line-height:1.35;color:#60798A;max-width:820px;margin:0}
.closePause .closeBeatIcon{background:#FFE8E8;color:#C33C3C;border-color:#F2C5C5}
.closePause h2{color:#C33C3C}
.closeRoute .closeBeatIcon{background:#EBF1FA;color:var(--blue)}
.closeRouteSteps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.closeRouteSteps span{background:#F4F8FC;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-size:12px;font-weight:800;color:#557285}
.closeBank .closeBeatIcon{background:#F2F8FE;color:#287DC2}
.closeValidated .closeBeatIcon{background:#EAF8EE;color:#22A447;border-color:#CBECD4}
.closeValidated h2{color:#1E9B43}
.closeWin{width:min(1180px,94vw);margin:auto;display:grid;gap:22px}
.closeWinTitle{text-align:center;font-size:clamp(36px,4.5vw,68px);line-height:.96;letter-spacing:-.05em;font-weight:900}
.closeSplit{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.closeSide{border:1px solid var(--line);border-radius:24px;padding:28px;min-height:360px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;background:#F7FAFC}
.closeSide.bank{background:#F1F8FF;border-color:#CFE2F6}.closeSide.carolina{background:#F3FBF5;border-color:#CBECD4}
.closeSideIcon{width:82px;height:82px;border-radius:24px;display:grid;place-items:center;margin-bottom:20px;background:#fff;color:var(--blue);box-shadow:0 12px 26px rgba(31,41,51,.08)}
.closeSide.carolina .closeSideIcon{color:#22A447}
.closeSideIcon svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.closeSide small{font-size:9px;font-weight:900;letter-spacing:.12em;color:#6E8798}
.closeSide strong{font-size:clamp(32px,3.2vw,52px);line-height:.96;letter-spacing:-.045em;margin:12px 0}
.closeSide p{font-size:14px;line-height:1.45;color:#60798A;max-width:420px;margin:0}
.closeFinal{background:var(--navy);color:#fff;border-radius:16px;padding:16px 20px;text-align:center;font-size:clamp(17px,1.45vw,23px);font-weight:800}
.closeFinal span{color:#8CC4F5}
@media(max-width:900px){.closeSplit{grid-template-columns:1fr}.closeSide{min-height:220px}.closeBeat h2{font-size:56px}.closeBeatIcon{width:82px;height:82px}.closeBeatIcon svg{width:44px;height:44px}}
'''
          if '.closeBeat{' not in s:
              s = s.replace('</style>', css + '</style>')

          s = s.replace("const stages=['Hipótesis','Opportunity Brief','Supuestos','Evidencia','Propuesta de valor','Modelo','Piloto'];",
                        "const stages=['Hipótesis','Opportunity Brief','Supuestos','Evidencia','Propuesta de valor','Modelo','Piloto','Cierre'];",1)

          old_pattern = re.compile(r"\{stage:6,time:'9:20–10:00',k:'11 · CIERRE'.*?\}\];let idx=", re.S)
          new_slides = r'''{stage:7,time:'9:20–9:27',k:'11 · CIERRE · EL PUNTO DE QUIEBRE',body:`<div class="closeBeat closePause"><div class="closeBeatIcon"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="M25 23v18M39 23v18"/></svg></div><h2>CRÉDITO PAUSADO</h2><p>Volvemos al punto donde quedó Carolina: la operación sigue viva, pero el tiempo continúa corriendo.</p></div>`},{stage:7,time:'9:27–9:34',k:'12 · CIERRE · INTERVENCIÓN',body:`<div class="closeBeat closeRoute"><div class="closeBeatIcon"><svg viewBox="0 0 64 64"><path d="M32 8 52 16v15c0 12-8 21-20 25C20 52 12 43 12 31V16Z"/><path d="m23 32 6 6 13-14"/></svg></div><h2>RUTA SEGURA INTERVIENE</h2><p>Con autorización de Carolina, organiza el caso y conecta la corrección con la operación hipotecaria.</p><div class="closeRouteSteps"><span>Ordena antecedentes</span><span>Coordina responsables</span><span>Reúne evidencia</span></div></div>`},{stage:7,time:'9:34–9:41',k:'13 · CIERRE · REINGRESO',body:`<div class="closeBeat closeBank"><div class="closeBeatIcon"><svg viewBox="0 0 64 64"><path d="M8 25h48M12 25 32 10l20 15M14 28v20M26 28v20M38 28v20M50 28v20M8 50h48"/><path d="m42 17 5 5 9-10"/></svg></div><h2>EL BANCO REINCORPORA</h2><p>Recibe un expediente trazable, valida la actualización y devuelve el caso al flujo de evaluación.</p></div>`},{stage:7,time:'9:41–9:48',k:'14 · CIERRE · VALIDACIÓN',body:`<div class="closeBeat closeValidated"><div class="closeBeatIcon"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="24"/><path d="m20 33 8 8 17-19"/></svg></div><h2>CRÉDITO VALIDADO</h2><p>La evaluación puede continuar con la información correcta antes de que la oportunidad pierda vigencia.</p></div>`},{stage:7,time:'9:48–10:00',k:'15 · CIERRE · CONTINUIDAD',body:`<div class="closeWin"><div class="closeWinTitle">Cuando la operación sigue viva,<br><span style="color:var(--blue)">ambos ganan.</span></div><div class="closeSplit"><section class="closeSide bank"><div class="closeSideIcon"><svg viewBox="0 0 64 64"><path d="M8 25h48M12 25 32 10l20 15M14 28v20M26 28v20M38 28v20M50 28v20M8 50h48"/><path d="M24 38h16"/></svg></div><small>BANCO</small><strong>Crédito colocado</strong><p>El banco conserva una operación viable y reduce reprocesos evitables.</p></section><section class="closeSide carolina"><div class="closeSideIcon"><svg viewBox="0 0 64 64"><path d="M10 30 32 12l22 18"/><path d="M16 27v25h32V27"/><path d="M26 52V37h12v15"/><path d="m44 17 4 4 8-9"/></svg></div><small>CAROLINA</small><strong>Proyecto de vida en marcha</strong><p>Obtiene el crédito y puede continuar con su casa propia.</p></section></div><div class="closeFinal"><span>Eso es lo que queremos medir:</span> si Ruta Segura logra mantener viva una operación que hoy puede perderse mientras el dato se corrige.</div></div>`}];let idx='''
          s, n = old_pattern.subn(new_slides, s, count=1)
          if n != 1:
              raise SystemExit(f'Could not replace closing slide: {n}')

          p.write_text(s, encoding='utf-8')

          sp = Path('speaker.html')
          if sp.exists():
              t = sp.read_text(encoding='utf-8')
              old_card = re.compile(r'<article class="card" id="s12" data-title="La continuidad conecta a Carolina con el caso de negocio">.*?</article>', re.S)
              new_card = '''<article class="card" id="s12" data-title="Cierre: de crédito pausado a continuidad"><aside class="side"><div class="num">12</div><div class="time">9:20–10:00</div></aside><div><h2 class="title">Cerrar el círculo: del crédito pausado a la continuidad</h2><div class="script"><p><b>[CRÉDITO PAUSADO]</b> Volvemos exactamente al punto donde dejamos a Carolina al comienzo: el crédito está pausado y el tiempo sigue corriendo.</p><p><b>[RUTA SEGURA INTERVIENE]</b> La propuesta no reemplaza a los actores. Ordena el caso, coordina la corrección y reúne evidencia para que el banco pueda retomarlo.</p><p><b>[EL BANCO REINCORPORA]</b> El banco recibe el expediente, valida la actualización y devuelve el caso al flujo de evaluación.</p><p><b>[CRÉDITO VALIDADO]</b> Si la información correcta llega a tiempo, la operación puede continuar antes de perder vigencia.</p><p><b>[PANTALLA DIVIDIDA]</b> A un lado, el banco conserva una colocación viable. Al otro, Carolina obtiene el crédito para continuar con su proyecto de vida.</p><p><b>Eso es continuidad hipotecaria: no medir cuántos reclamos generamos, sino cuántas operaciones que podían perderse logran seguir vivas.</b></p><p>La casa estaba lista. El desafío es que el dato correcto también llegue a tiempo. Gracias.</p></div><div class="screenref"><b>En pantalla:</b> avanzar por las cinco micro-slides del cierre. Hacer una pausa breve en “CRÉDITO PAUSADO” para conectar explícitamente con la introducción y cerrar en la pantalla 50/50 Banco / Carolina.</div></div></article>'''
              t, m = old_card.subn(new_card, t, count=1)
              if m != 1:
                  raise SystemExit(f'Could not update speaker closing card: {m}')
              sp.write_text(t, encoding='utf-8')

          Path('.github/workflows/closing-loop.yml').unlink(missing_ok=True)
          PY

      - name: Commit closing sequence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Conecta el cierre con la introducción"
          git push
