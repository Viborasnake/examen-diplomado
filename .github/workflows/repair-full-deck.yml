name: Repair full deck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-full-deck.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full deck and remove only Why Ruta slide
        shell: bash
        run: |
          set -euo pipefail
          GOOD=19294488f1da9275a00a201a7f7091da3870eb3a
          git show "$GOOD:index.html" > index.html
          git show "$GOOD:speaker.html" > speaker.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          # PRESENTATION: remove only the target JS slide and keep all following slides.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start_marker = ",{stage:5,time:'6:40–7:05',k:'09 · POR QUÉ RUTA SEGURA'"
          next_marker = "{stage:5,time:'7:05–7:30',k:'10 · MODELO DE MONETIZACIÓN'"
          start = s.find(start_marker)
          end = s.find(next_marker, start + 1) if start != -1 else -1
          if start == -1 or end == -1:
              raise SystemExit('No se pudo localizar de forma segura la slide Por qué Ruta Segura')
          s = s[:start] + ',' + s[end:]

          # Renumber visible main-slide kickers 01..N without touching intro micro-slides.
          n = 0
          def renum_k(m):
              nonlocal_dummy = None
              global n
              n += 1
              label = re.sub(r'^\d+\s*·\s*', '', m.group(1))
              return "k:'%02d · %s'" % (n, label)
          s = re.sub(r"k:'([^']*)'", renum_k, s)

          # Sanity checks: full deck must contain late slides and valid delimiter after EXPERIENCIA.
          required = ['MODELO DE MONETIZACIÓN','CÓMO SABREMOS QUE FUNCIONA','VALOR PARA EL BANCO','PILOTO Y ESCALA','CRÉDITO PAUSADO','RUTA SEGURA INTERVIENE','CRÉDITO VALIDADO']
          for token in required:
              if token not in s:
                  raise SystemExit(f'Falta slide requerida en presentación: {token}')
          if "EXPERIENCIA',title:'Menos fricción, sin crear otro silo'" not in s:
              raise SystemExit('Falta slide Experiencia')
          p.write_text(s, encoding='utf-8')

          # SPEAKER: restore full notes, remove only matching article, then renumber 00..N.
          sp = Path('speaker.html')
          t = sp.read_text(encoding='utf-8')
          card_re = re.compile(r'<article class="card"\s+id="s\d+".*?</article>', re.S)
          cards = card_re.findall(t)
          if len(cards) < 15:
              raise SystemExit(f'Speaker restaurado incompleto antes de filtrar: {len(cards)} cards')

          kept = []
          removed = 0
          for card in cards:
              if '<h2 class="title">¿Por qué Ruta Segura?</h2>' in card:
                  removed += 1
                  continue
              kept.append(card)
          if removed != 1:
              raise SystemExit(f'Se esperaba quitar 1 card Por qué Ruta Segura; se quitaron {removed}')

          rebuilt = []
          for i, card in enumerate(kept):
              card = re.sub(r'id="s\d+"', f'id="s{i}"', card, count=1)
              card = re.sub(r'<div class="num">\d+</div>', f'<div class="num">{i:02d}</div>', card, count=1)
              card = re.sub(r'<div class="time">.*?</div>', '', card, flags=re.S)
              rebuilt.append(card)

          first = card_re.search(t)
          all_matches = list(card_re.finditer(t))
          if not first or not all_matches:
              raise SystemExit('No se encontraron cards en speaker')
          prefix = t[:first.start()]
          suffix = t[all_matches[-1].end():]
          timeline = '<nav class="timeline" aria-label="Ir a una sección">' + ''.join(f'<a href="#s{i}">{i:02d}</a>' for i in range(len(rebuilt))) + '</nav>'
          prefix = re.sub(r'<nav class="timeline" aria-label="Ir a una sección">.*?</nav>', timeline, prefix, count=1, flags=re.S)
          t = prefix + '\n\n'.join(rebuilt) + suffix

          # Speaker should contain the whole narrative, not just the tail.
          required_speaker = ['No partimos con Carolina. La encontramos','Supuestos que podían hacer caer la oportunidad','Prototipo: del relato al reingreso','Modelo de monetización B2B2C','Outcome, North Star y KPIs','Cuando la operación sigue viva, ambos ganan']
          for token in required_speaker:
              if token not in t:
                  raise SystemExit(f'Falta sección requerida en speaker: {token}')
          sp.write_text(t, encoding='utf-8')

          # Remove this temporary workflow after successful repair.
          Path('.github/workflows/repair-full-deck.yml').unlink(missing_ok=True)
          PY

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restaura presentación completa y speaker"
          git push
