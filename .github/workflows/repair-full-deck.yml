name: Repair full deck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-full-deck.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full deck and remove only Why Ruta slide
        shell: bash
        run: |
          set -euo pipefail
          GOOD=19294488f1da9275a00a201a7f7091da3870eb3a
          git show "$GOOD:index.html" > index.html
          git show "$GOOD:speaker.html" > speaker.html

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = "title:'¿Por qué este producto y no otro?'"
          nxt = "title:'B2B2C: Carolina usa; el banco paga'"
          pos = s.find(target)
          if pos == -1:
              raise SystemExit('No se encontró la slide objetivo en el deck restaurado')
          start = s.rfind(',{stage:', 0, pos)
          end_title = s.find(nxt, pos)
          end = s.rfind('{stage:', pos, end_title) if end_title != -1 else -1
          if start == -1 or end == -1:
              raise SystemExit('No se pudieron determinar límites seguros para quitar la slide objetivo')
          s = s[:start] + ',' + s[end:]

          counter = {'n': 0}
          def renum_k(m):
              counter['n'] += 1
              label = re.sub(r'^\d+\s*·\s*', '', m.group(1))
              return "k:'%02d · %s'" % (counter['n'], label)
          s = re.sub(r"k:'([^']*)'", renum_k, s)

          if target in s:
              raise SystemExit('La slide objetivo todavía está presente')
          if s.count('{stage:') < 18:
              raise SystemExit(f'Deck incompleto: solo {s.count("{stage:")} slides principales')
          for token in ['MODELO DE MONETIZACIÓN','CÓMO SABREMOS QUE FUNCIONA','VALOR PARA EL BANCO','PILOTO Y ESCALA','CRÉDITO PAUSADO','INTERVIENE','CRÉDITO VALIDADO','ambos ganan']:
              if token not in s:
                  raise SystemExit(f'Falta contenido requerido en presentación: {token}')
          p.write_text(s, encoding='utf-8')

          sp = Path('speaker.html')
          t = sp.read_text(encoding='utf-8')
          card_re = re.compile(r'<article class="card"\s+id="s\d+".*?</article>', re.S)
          matches = list(card_re.finditer(t))
          cards = [m.group(0) for m in matches]
          if len(cards) < 15:
              raise SystemExit(f'Speaker restaurado incompleto: {len(cards)} cards')

          kept = []
          removed = 0
          for card in cards:
              if '<h2 class="title">¿Por qué Ruta Segura?</h2>' in card:
                  removed += 1
              else:
                  kept.append(card)
          if removed != 1:
              raise SystemExit(f'Se esperaba quitar exactamente 1 card; se quitaron {removed}')

          rebuilt = []
          for i, card in enumerate(kept):
              card = re.sub(r'id="s\d+"', f'id="s{i}"', card, count=1)
              card = re.sub(r'<div class="num">\d+</div>', f'<div class="num">{i:02d}</div>', card, count=1)
              card = re.sub(r'<div class="time">.*?</div>', '', card, flags=re.S)
              rebuilt.append(card)

          prefix = t[:matches[0].start()]
          suffix = t[matches[-1].end():]
          timeline = '<nav class="timeline" aria-label="Ir a una sección">' + ''.join(f'<a href="#s{i}">{i:02d}</a>' for i in range(len(rebuilt))) + '</nav>'
          prefix = re.sub(r'<nav class="timeline" aria-label="Ir a una sección">.*?</nav>', timeline, prefix, count=1, flags=re.S)
          t = prefix + '\n\n'.join(rebuilt) + suffix

          for token in ['Del sueño de la casa propia a una operación en riesgo','No partimos con Carolina. La encontramos','Supuestos que podían hacer caer la oportunidad','Prototipo: del relato al reingreso','Menos fricción, sin crear otro silo','Quién usa y quién paga','Modelo de monetización B2B2C','Outcome, North Star y KPIs','Piloto y condición de escala','Cuando la operación sigue viva, ambos ganan']:
              if token not in t:
                  raise SystemExit(f'Falta sección requerida en speaker: {token}')
          if len(rebuilt) < 18:
              raise SystemExit(f'Speaker final incompleto: {len(rebuilt)} cards')
          sp.write_text(t, encoding='utf-8')

          Path('.github/workflows/repair-full-deck.yml').unlink(missing_ok=True)
          PY

      - name: Commit repaired files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Restaura presentación completa y speaker"
          git push
