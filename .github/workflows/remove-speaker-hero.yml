name: Limpiar cabecera speaker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar bloque introductorio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('speaker.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\n<section class="hero">[\s\S]*?</section>\n', '\n', s, count=1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/remove-speaker-hero.yml').unlink(missing_ok=True)
          PY
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Quita cabecera introductoria del guion speaker"
          git push
