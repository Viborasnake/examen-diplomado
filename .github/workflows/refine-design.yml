name: Refine presentation design
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-design.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine design and intro controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* Visual refinement v1 */'
          css='/* Visual refinement v1 */.slide{padding:38px 56px 32px}.top{align-items:center;min-height:34px}.kicker{font-size:10px;letter-spacing:.14em;color:#557286}.time{display:none!important}.stagebar{gap:6px;flex-wrap:nowrap}.stage{padding:6px 10px;border-radius:999px;background:#F4F7FA;color:#8AA0AE;font-size:8px;letter-spacing:.025em;border:1px solid transparent;transition:.2s ease}.stage.on{background:#EFF6FD;color:var(--blue);border-color:#D6E9F8;box-shadow:0 3px 10px #3F8CD510}.main{padding:8px 0 2px}.title{max-width:1080px;margin:14px 0 16px;text-wrap:balance}.footer{padding-top:9px;color:#91A3B0;border-color:#E8EEF3}.card,.column,.panel,.node,.role,.phase,.price,.pilotbox,.valueCards article,.storyPanel,.casebox{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}.column.blue,.role.route,.casebox,.pilotbox,.sensitivity,.focusStep.final{box-shadow:0 14px 34px #20384A10}.callout,.formula,.question{box-shadow:0 8px 22px #20384A0A}.price{border-radius:16px}.phone{box-shadow:0 18px 42px #21384C18}.focusInsight{box-shadow:0 10px 28px #1F29331A}.controls{z-index:320!important;border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 50px #17212A52!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.controls button{transition:transform .16s ease,filter .16s ease,background .16s ease}.controls button:hover{transform:translateY(-1px);filter:brightness(1.08)}.controls button:focus-visible{outline:2px solid #9CCCF2;outline-offset:2px}.controls.intro-hidden{opacity:1!important;pointer-events:auto!important;visibility:visible!important}.intro-sequence{z-index:200!important}.intro-inner{width:min(1040px,90vw)}.intro-icon{box-shadow:0 12px 32px #20384A12}.intro-title{text-wrap:balance}.intro-sub{max-width:760px}@media(max-width:980px){.slide{padding:32px 34px 28px}.stagebar{gap:3px}.stage{padding:5px 7px;font-size:7px}.controls{width:min(760px,calc(100% - 20px))}}'
          if marker not in s:
              s=s.replace('</style>',css+'</style>',1)
          js_marker='// Intro controller bridge:'
          js="""// Intro controller bridge: keep controls visible and clickable during slide 0.\n(function(){const p=document.getElementById('prev'),n=document.getElementById('next'),c=document.getElementById('count'),b=document.getElementById('bar');function active(){return typeof introSequence!=='undefined'&&introSequence&&document.body.contains(introSequence)}function total(){try{return(typeof introOrder!=='undefined'&&introOrder.length)||7}catch(_){return 7}}function sync(){if(!active())return;const t=total(),cur=(typeof introStep!=='undefined'?introStep:0)+1;if(c)c.textContent=cur+'/'+t;if(b)b.style.width=((cur/t)*100)+'%';const ctl=document.querySelector('.controls');if(ctl){ctl.classList.remove('hidden');ctl.classList.remove('intro-hidden')}}if(typeof setIntroStep==='function'){const old=setIntroStep;setIntroStep=function(step){old(step);sync()}}p?.addEventListener('click',function(e){if(!active())return;e.preventDefault();e.stopImmediatePropagation();if(typeof introStep!=='undefined'&&introStep>0)setIntroStep(introStep-1);sync()},true);n?.addEventListener('click',function(e){if(!active())return;e.preventDefault();e.stopImmediatePropagation();const t=total();if(typeof introStep!=='undefined'&&introStep<t-1)setIntroStep(introStep+1);else if(typeof finishIntro==='function')finishIntro();sync()},true);sync()})();\n"""
          if js_marker not in s:
              s=s.replace('</script>',js+'</script>',1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/refine-design.yml').unlink(missing_ok=True)
          PY
      - name: Commit refinements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Afina diseño y habilita controlador en slide 0'
          git push
