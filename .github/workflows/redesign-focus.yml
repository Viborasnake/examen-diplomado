name: Redesign focus slide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-focus.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Redesign focus slide
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Add focused layout styles only once.
          css = r'''
          .focusRedesign{display:grid;gap:22px;align-items:center}
          .focusSteps{display:grid;grid-template-columns:1fr 52px 1fr 52px 1.18fr;gap:10px;align-items:stretch}
          .focusStep{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:26px 24px;display:flex;flex-direction:column;justify-content:center;min-height:230px;position:relative;overflow:hidden}
          .focusStep:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#DCE5EC}
          .focusStep small{font-size:9px;font-weight:900;letter-spacing:.12em;color:#708796;margin-bottom:14px}
          .focusStep strong{font-size:clamp(24px,2.2vw,34px);line-height:1.03;letter-spacing:-.04em;color:var(--navy);margin-bottom:12px}
          .focusStep p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
          .focusStep.mid{background:#F4F8FC}
          .focusStep.mid:before{background:#9FC8EA}
          .focusStep.final{background:#F1F8FF;border-color:#BFD9F3;box-shadow:0 14px 34px #3F8CD51A}
          .focusStep.final:before{width:6px;background:var(--blue)}
          .focusStep.final small{color:var(--blue)}
          .focusStep.final strong{font-size:clamp(28px,2.7vw,42px);color:var(--blue)}
          .focusArrow{display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--blue)}
          .focusInsight{background:var(--navy);color:#fff;border-radius:16px;padding:18px 22px;font-size:clamp(16px,1.45vw,22px);font-weight:800;line-height:1.35;text-align:center}
          .focusInsight b{color:#9CCCF2}
          @media(max-width:900px){.focusSteps{grid-template-columns:1fr}.focusArrow{transform:rotate(90deg);min-height:34px}.focusStep{min-height:130px}}
          '''
          if '.focusRedesign{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          pattern = re.compile(r"\{stage:1,time:'0:30–1:15',k:'02 · DE LA HIPÓTESIS AL FOCO',title:'De una piscina amplia a un evento crítico',body:`.*?`\},\{stage:2", re.S)
          replacement = r'''{stage:1,time:'0:30–1:15',k:'02 · DE LA HIPÓTESIS AL FOCO',title:'De una hipótesis amplia a un momento crítico',body:`<div class="focusRedesign"><div class="focusSteps"><article class="focusStep"><small>01 · HIPÓTESIS INICIAL</small><strong>Control de datos personales</strong><p>Partimos explorando una necesidad amplia: entender y ejercer control sobre los datos.</p></article><div class="focusArrow">→</div><article class="focusStep mid"><small>02 · PRIMER RECORTE</small><strong>Banca</strong><p>Buscamos un contexto donde una inconsistencia pudiera afectar una decisión concreta.</p></article><div class="focusArrow">→</div><article class="focusStep final"><small>03 · SEGMENTO FINAL</small><strong>Hipotecarios bloqueados por una inconsistencia</strong><p>El dato deja de ser abstracto cuando puede detener una operación viable.</p></article></div><div class="focusInsight">No buscamos cualquier problema de datos. <b>Buscamos el momento en que un dato incorrecto cambia una decisión real.</b></div></div>`},{stage:2'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'No se pudo reemplazar de forma segura la slide de foco. Coincidencias: {n}')
          s = s2

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/redesign-focus.yml').unlink(missing_ok=True)
          PY

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Mejora diseño del foco de segmento"
          git push
