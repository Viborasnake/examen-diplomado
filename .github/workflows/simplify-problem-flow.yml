name: Simplify mortgage problem flow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplify-problem-flow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simplify problem flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''.impactFlow.simple{grid-template-columns:1fr 48px 1fr 48px 1fr;align-items:center}.impactFlow.simple .pbox{min-height:178px;padding:24px;justify-content:center;text-align:center}.impactFlow.simple .pbox strong{font-size:clamp(24px,2.2vw,38px);line-height:1.02;margin:0}.impactFlow.simple .pbox.bad strong{color:#B73E3E}.impactFlow.simple .pa{font-size:34px}.impactBreak.simple{margin-top:18px;text-align:center;font-size:clamp(16px,1.45vw,23px);font-weight:700;padding:20px 24px}.impactBreak.simple b{color:var(--blue)}@media(max-width:900px){.impactFlow.simple{grid-template-columns:1fr}.impactFlow.simple .pa{transform:rotate(90deg)}.impactFlow.simple .pbox{min-height:112px}.impactBreak.simple{font-size:17px}}'''
          if '.impactFlow.simple{' not in s:
              s = s.replace('</style>', css + '</style>')

          old = '''<div class="problemFlow impactFlow"><article class="pbox blue"><small>01 · YA PAGADA</small><strong>Deuda regularizada</strong><p>La persona ya resolvió el problema.</p></article><div class="pa">→</div><article class="pbox bad"><small>02 · AÚN VISIBLE</small><strong>Sigue apareciendo</strong><p>El dato todavía bloquea la evaluación.</p></article><div class="pa">→</div><article class="pbox"><small>03 · CONSECUENCIA</small><strong>Crédito detenido</strong><p>La operación hipotecaria deja de avanzar.</p></article></div><div class="impactBreak"><b>Quiebre crítico:</b> corregir el origen no garantiza que la actualización llegue al banco a tiempo para retomar la evaluación.</div>'''
          new = '''<div class="problemFlow impactFlow simple"><article class="pbox blue"><strong>Deuda pagada</strong></article><div class="pa">→</div><article class="pbox bad"><strong>Dato sigue activo</strong></article><div class="pa">→</div><article class="pbox"><strong>Crédito detenido</strong></article></div><div class="impactBreak simple"><b>El problema:</b> corregir no basta si el banco no recibe el cambio a tiempo.</div>'''

          if old not in s:
              raise SystemExit('Expected problem flow block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/simplify-problem-flow.yml').unlink(missing_ok=True)
          PY

      - name: Commit simplified flow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplifica el flujo del problema hipotecario"
          git push
