name: Group closing sequence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/group-closing.yml'

permissions:
  contents: write

jobs:
  group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Group closing mini-slides
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # PRESENTATION: the closing sequence remains visually progressive,
          # but it is one logical slide, just like the opening micro-sequence is slide 00 in speaker notes.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # All closing micro-screens share the same visible slide number.
          s, nclose = re.subn(r"k:'(?:15|16|17|18|19|20) · CIERRE'", "k:'15 · CIERRE'", s)
          if nclose < 4:
              raise SystemExit(f'No se encontraron suficientes micro-slides de cierre: {nclose}')

          # Make the on-screen counter/progress use logical slides: 01..15.
          marker = "function render(){const s=slides[idx];"
          if marker not in s:
              raise SystemExit('No se encontró render() en index.html')
          s = s.replace(marker, "const logicalSlideTotal=15;function logicalSlideNumber(){return idx>=14?15:idx+1}function render(){const s=slides[idx],logical=logicalSlideNumber();", 1)
          s = s.replace("<span>${idx+1} / ${slides.length}</span>", "<span>${logical} / ${logicalSlideTotal}</span>", 1)
          old_progress = "bar.style.width=((idx+1)/slides.length*100)+'%';count.textContent=`${idx+1}/${slides.length}`;"
          new_progress = "bar.style.width=(logical/logicalSlideTotal*100)+'%';count.textContent=`${logical}/${logicalSlideTotal}`;"
          if old_progress not in s:
              raise SystemExit('No se encontró contador principal para agrupar el cierre')
          s = s.replace(old_progress, new_progress, 1)

          p.write_text(s, encoding='utf-8')

          # SPEAKER: merge cards 15..end into one logical card 15.
          sp = Path('speaker.html')
          t = sp.read_text(encoding='utf-8')
          card_re = re.compile(r'<article class="card"\s+id="s(\d+)".*?</article>', re.S)
          matches = list(card_re.finditer(t))
          if not matches:
              raise SystemExit('No se encontraron cards en speaker')

          cards_by_num = {int(m.group(1)): m.group(0) for m in matches}
          if not all(i in cards_by_num for i in range(0, 19)):
              raise SystemExit('El speaker no contiene la secuencia esperada 00..18 antes de agrupar')

          closing = '''<article class="card" id="s15" data-title="Cierre: de crédito pausado a operación viva"><aside class="side"><div class="num">15</div></aside><div><h2 class="title">Cierre: de crédito pausado a operación viva</h2><div class="script"><p><b>[CRÉDITO PAUSADO]</b> Volvemos exactamente al punto donde quedó Carolina. La operación sigue viva, pero el tiempo continúa corriendo.</p><p><b>[RUTA SEGURA INTERVIENE]</b> Ruta Segura ordena los antecedentes, coordina a los responsables y reúne evidencia para que la corrección no quede desconectada del proceso hipotecario.</p><p><b>[EL BANCO REINCORPORA]</b> El banco recibe un expediente trazable, valida la actualización y reincorpora el caso al flujo antes de que pierda vigencia.</p><p><b>[CRÉDITO VALIDADO]</b> La evaluación puede continuar usando información correcta. Ese es el momento en que la continuidad deja de ser una promesa y se vuelve un resultado observable.</p><p><b>[AMBOS GANAN]</b> El banco conserva una colocación viable y reduce reprocesos evitables. Carolina obtiene el crédito y puede continuar con su proyecto de vida.</p><p><b>Ese es nuestro criterio final de éxito:</b> mantener viva la operación, demostrar valor para el banco y reducir el costo por caso cuando el modelo escale.</p></div><div class="screenref"><b>En pantalla:</b> estas son micro-slides del mismo cierre. Avanzar una a una, igual que en la introducción; en el guion completo corresponden todas a la slide 15.</div></div></article>'''

          first = matches[0]
          last = matches[-1]
          prefix = t[:first.start()]
          suffix = t[last.end():]
          kept = [cards_by_num[i] for i in range(15)] + [closing]
          t = prefix + '\n\n'.join(kept) + suffix

          timeline = '<nav class="timeline" aria-label="Ir a una sección">' + ''.join(f'<a href="#s{i}">{i:02d}</a>' for i in range(16)) + '</nav>'
          t = re.sub(r'<nav class="timeline" aria-label="Ir a una sección">.*?</nav>', timeline, t, count=1, flags=re.S)

          # Safety checks.
          if 'id="s16"' in t or 'id="s17"' in t or 'id="s18"' in t:
              raise SystemExit('Quedaron cards de cierre separadas en speaker')
          for token in ['CRÉDITO PAUSADO','RUTA SEGURA INTERVIENE','EL BANCO REINCORPORA','CRÉDITO VALIDADO','AMBOS GANAN']:
              if token not in t:
                  raise SystemExit(f'Falta parte del cierre agrupado: {token}')

          sp.write_text(t, encoding='utf-8')

          Path('.github/workflows/group-closing.yml').unlink(missing_ok=True)
          PY

      - name: Commit grouped closing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Agrupa cierre como una sola slide lógica"
          git push
