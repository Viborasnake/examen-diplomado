name: Make cover and drop redundant slide

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/make-cover-and-drop-redundant-slide.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch presentation
        run: python3 .github/patch_cover.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/make-cover-and-drop-redundant-slide.yml .github/patch_cover.py
          git add -A
          git commit -m "Convierte intro final en portada y elimina slide redundante"
          git push
