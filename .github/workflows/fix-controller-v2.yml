name: Fix presentation controller v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-controller-v2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace controller logic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Keep controls permanently visible while the intro (logical slide 0) is active.
          css='.controls.intro-active{opacity:1!important;pointer-events:auto!important;visibility:visible!important;transform:translateX(-50%)!important}.controls.intro-active.auto-hide{opacity:1!important;pointer-events:auto!important;transform:translateX(-50%)!important}'
          if '.controls.intro-active{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          start='function go(n){idx=Math.max(0,Math.min(slides.length-1,n));render()}'
          end='</script>'
          i=s.find(start)
          j=s.rfind(end)
          if i<0 or j<0 or j<=i:
              raise SystemExit('No se encontró el bloque JS del controlador')

          clean=r'''function go(n){idx=Math.max(0,Math.min(slides.length-1,n));render()}
const introSequence=document.getElementById('introSequence');
const introStates=[...document.querySelectorAll('[data-intro]')];
const introOrder=['dream','evaluation','paperwork','offers','problem','paused','risk'];
let introStep=0;
const controlsAuto=document.querySelector('.controls');
const prevBtn=document.getElementById('prev');
const nextBtn=document.getElementById('next');
const fullBtn=document.getElementById('full');
let controlsHideTimer;
function introActive(){return !!(introSequence&&document.body.contains(introSequence)&&introSequence.classList.contains('show'))}
function introState(name){introStates.forEach(x=>x.classList.toggle('active',x.dataset.intro===name))}
function syncController(){
  if(introActive()){
    const current=introStep+1,total=introOrder.length;
    controlsAuto?.classList.add('intro-active');
    controlsAuto?.classList.remove('auto-hide');
    bar.style.width=(current/total*100)+'%';
    count.textContent=`0 · ${current}/${total}`;
  }else{
    controlsAuto?.classList.remove('intro-active');
    const logical=logicalSlideNumber();
    bar.style.width=(logical/logicalSlideTotal*100)+'%';
    count.textContent=`${logical}/${logicalSlideTotal}`;
  }
}
function setIntroStep(step){
  introStep=Math.max(0,Math.min(introOrder.length-1,step));
  introState(introOrder[introStep]);
  syncController();
}
function wakeControls(){
  if(!controlsAuto)return;
  controlsAuto.classList.remove('auto-hide');
  clearTimeout(controlsHideTimer);
  if(!introActive())controlsHideTimer=setTimeout(()=>controlsAuto.classList.add('auto-hide'),1000);
}
function finishIntro(){
  if(!introActive())return;
  introSequence.classList.add('exit');
  setTimeout(()=>{
    introSequence.remove();
    controlsAuto?.classList.remove('intro-active','intro-hidden','auto-hide');
    render();
    wakeControls();
  },320);
}
function navigate(direction){
  wakeControls();
  if(introActive()){
    if(direction>0){
      if(introStep<introOrder.length-1)setIntroStep(introStep+1);else finishIntro();
    }else if(direction<0&&introStep>0){
      setIntroStep(introStep-1);
    }
    return;
  }
  go(idx+direction);
}
prevBtn.onclick=()=>navigate(-1);
nextBtn.onclick=()=>navigate(1);
fullBtn.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
window.addEventListener('keydown',e=>{
  const forward=['ArrowRight','PageDown',' ','Enter'];
  const back=['ArrowLeft','PageUp'];
  if(forward.includes(e.key)){e.preventDefault();navigate(1);return}
  if(back.includes(e.key)){e.preventDefault();navigate(-1);return}
  if(e.key.toLowerCase()==='f')fullBtn.click();
});
window.addEventListener('hashchange',()=>{
  if(introActive())return;
  const n=parseInt(location.hash.slice(1));
  if(n>=1&&n<=slides.length&&n-1!==idx){idx=n-1;render();syncController()}
});
const initialHash=location.hash;
const initialN=parseInt(location.hash.slice(1));
if(initialN>=1&&initialN<=slides.length)idx=initialN-1;
render();
function runSpeakerIntro(){
  if(!introSequence)return;
  controlsAuto?.classList.add('intro-active');
  introSequence.classList.add('show');
  setIntroStep(0);
  wakeControls();
}
if((!initialHash||initialHash==='#1')&&idx===0)runSpeakerIntro();else{introSequence?.remove();syncController()}
['keydown','mousemove','mousedown','touchstart'].forEach(evt=>window.addEventListener(evt,wakeControls,{passive:true}));
wakeControls();
const presentTimer=document.getElementById('presentTimer');
let timerRemaining=600,timerRun=null;
function drawPresentTimer(){
  const mm=String(Math.floor(timerRemaining/60)).padStart(2,'0'),ss=String(timerRemaining%60).padStart(2,'0');
  presentTimer.textContent=`${mm}:${ss}`;
  presentTimer.style.color=timerRemaining<=0?'#F87171':timerRemaining<=60?'#FBBF24':'#fff';
}
drawPresentTimer();
setTimeout(()=>{timerRun=setInterval(()=>{if(timerRemaining>0)timerRemaining--;drawPresentTimer();if(timerRemaining<=0)clearInterval(timerRun)},1000)},5000);
'''
          s=s[:i]+clean+s[j:]
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-controller-v2.yml').unlink(missing_ok=True)
          PY
      - name: Commit stable controller
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige navegación y estado del controlador'
          git push
